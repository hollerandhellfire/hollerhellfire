    { era: "y1", sort: 2300, key: false,

        title: "D Coale & Ezeqeel \u00b7 Atmospheric Monitoring \u00b7 Ariel Antagonist",
        body: "Penn State corridor. D\u2019s atmospheric monitoring maps the Ley Line network\u2019s surface expression in weather patterns. The instrument that will document the Veil\u2019s deterioration before the Divine Arc begins \u2014 she does not know this yet. Ariel (nature enforcer) opposes the monitoring because it maps the boundary he wants invisible.",

    { era: "y1", sort: 2400, key: false,
        date: "Year 1", dateSub: "Book 11 \u00b7 Catskill Valley",
        book: "Book 11",
        title: "Emily Keldren & Penemue \u00b7 Written Tradition \u00b7 The First Word\u2019s Archive",
        body: "Catskill Valley corridor. Emily\u2019s bond with Penemue connects the network to every word ever written \u2014 including Arcadia\u2019s first word, which Penemue has been carrying for twelve thousand years without knowing why it felt different. Lilandra Keldren (Emily\u2019s sister, Gift of the Spoken Word) bonds with Tharael of the Alps: first living practitioner connection across the Atlantic Ley Line.",
        chars: ["Emily Keldren", "Penemue", "Lilandra Keldren", "Tharael", "Delila Keldren"],
        color: "#92400e" },
    { era: "y1", sort: 2500, key: true,
        date: "Year 1", dateSub: "Saraqael\u2019s Defection",
        book: "Expansion Arc",
        title: "Saraqael Defects \u00b7 Pike County Assessor\u2019s Office \u00b7 Loren Ritcher",
        body: "Heaven\u2019s primary enforcer, the Hunter \u2014 a Grigori assigned to enforcement as punishment \u2014 comes to Pike County to assess the new compact. His enforcement instrument turns toward Loren Ritcher (Weaver, heart changer) and reports: <em>correct. Deeply correct.</em> He does not file the correction notice. He is in the Pike County assessor\u2019s office. Raguel is sent to assess the defection. Raguel meets Loren Ritcher. Raguel\u2019s report is withheld.",
        chars: ["Saraqael", "Loren Ritcher", "Raguel"],
        color: "#92400e" },
    // ──────── YEAR 2-3 ────────
    { era: "y2", sort: 3000, key: true,
        date: "Year 2 \u00b7 3:47 AM", dateSub: "WMB1 \u00b7 What the Mountain Kept",
        book: "WMB1",
        title: "The Seal Breaks \u00b7 Haagenti\u2019s Fault Line \u00b7 The Horde Emerges",
        body: "The coal seam fault line Haagenti prepared over forty years ruptures at 3:47 AM. Methane wyrms emerge from the Harlan seam trailing blue-white fire. Dixie speaks one word in the anchor bond. The wyrm stops. First geological claim under the compact\u2019s jurisdiction. <em>The compact was written for more than they knew.</em>",
        chars: ["Dixie", "Azazel", "Samyaza", "Haagenti"],
        color: "#0d9488" },
    { era: "y2", sort: 3100, key: true,
        date: "Year 2", dateSub: "WMB2 \u00b7 The General\u2019s Terms",
        book: "WMB2",
        title: "The Leviathan\u2019s Cardiac Frequency Legible \u00b7 First Since Arcadia",
        body: "The Leviathan\u2019s cardiac frequency becomes legible to the network for the first time since Arcadia\u2019s choosing in 12,000 BCE. Brian Lee mediates the Catskill rock dragon at ten. Ravos at the inner radius, watching.",
        chars: ["Brian Lee Combs (age 10)", "Samyaza", "The Leviathan", "Ravos"],
        color: "#0d9488" },
    { era: "y2", sort: 3200, key: false,
        date: "Year 2", dateSub: "WMB3 \u00b7 The Oldest War",
        book: "WMB3",
        title: "The Wardens at the Kitchen Table \u00b7 Wrong Compact Refused",
        body: "The Wardens come to the kitchen table. Brian Lee translates from his notebook. Cassith: <em>the threads were hidden for a thousand years specifically so they could be placed correctly when the time came.</em> The wrong compact formally refused \u2014 including its function as Satan\u2019s prison lock maintenance architecture.",
        chars: ["Brian Lee Combs", "All Seven Wardens", "Della", "Samyaza"],
        color: "#0d9488" },
    { era: "y2", sort: 3300, key: true,
        date: "Year 3 \u00b7 May", dateSub: "WMB4 \u00b7 Ravos and Brian",
        book: "WMB4",
        title: "Ravos Chooses Brian Lee \u00b7 The Dual Familiar Bond",
        body: "Brian Lee at ten years and four months. Ravos at the north edge for twenty minutes. Brian: <em>come closer.</em> In the field above the first word: <em>I know what it\u2019s building toward. You\u2019re going to have to say it.</em> The dual Familiar bond constituted: Leviathan and Ravos. Brian Lee is the first human mediator in twelve thousand years capable of receiving geological frequency at human-accessible scale. His notebook entries are the beginning of the Horde\u2019s longest mortal-layer translation project.",
        chars: ["Brian Lee Combs (age 10)", "Ravos", "The Leviathan"],
        color: "#0d9488" },
    { era: "y2", sort: 3400, key: false,
        date: "Year 3", dateSub: "WMB5 \u00b7 The Turn",
        book: "WMB5",
        title: "Brian Lee Names His Function",
        body: "Brian Lee: <em>I think I\u2019m here to be what the Web was designed to make possible. The relationship. The real version.</em> Not practitioner. Not Watcher. The Web\u2019s living expression named. The Nephilim\u2019s specific gift defined.",
        chars: ["Brian Lee Combs", "Samyaza", "Della"],
        color: "#0d9488" },
    { era: "y2", sort: 3500, key: true,
        date: "Year 3 \u00b7 July", dateSub: "WMB6 \u00b7 The New Compact",
        book: "WMB6",
        title: "New Compact Ratified \u00b7 Satan\u2019s Seal Substrate Fails \u00b7 The Chain Begins",
        body: "D Coale: thirty-one threads \u2014 sufficient. New Compact ratified at Della\u2019s property. The compact\u2019s frequency moves through the Church\u2019s institutional architecture and begins destabilizing Satan\u2019s seal substrate. Metatron acknowledges: <em>the formal framework is downstream of the Web. Always was.</em> Lucifer, in the deep places, understands what this means. The Order of Shadows\u2019 founding logic is now on a timer. <em>The Darkness, waiting since before the daughters\u2019 practice existed, begins to calculate.</em>",
        chars: ["D Coale", "Dixie", "Della", "Samyaza", "Metatron", "Lucifer"],
        color: "#0d9488" },
    // ──────── YEAR 3-4 (Web) ────────
    { era: "y4", sort: 4000, key: true,
        date: "Year 3\u20134", dateSub: "WW1 \u00b7 The Bone Mother\u2019s Daughter",
        book: "WW1",
        title: "The Equinox Gathering \u00b7 443 Practitioners \u00b7 Lateral Connections Revealed",
        body: "Hettie Maelin opens the bone record\u2019s full channel at the equinox gathering. Thirty thousand years of the daughters\u2019 practice in every geography simultaneously. 443 practitioners feel the same frequency shift at once. The lateral connections revealed \u2014 not restored, revealed. <em>They were never closed. They were suppressed. A suppressed door was always open.</em>",
        chars: ["Hettie Maelin", "Tom Maelin", "Rosalie Maelin-Combs", "443 Practitioners"],
        color: "#4a8c4a" },
    { era: "y4", sort: 4100, key: true,
        date: "Year 3\u20134", dateSub: "WW2 \u00b7 The Daughter of the Moon",
        book: "WW2",
        title: "Moon-Bride Tradition Restored \u00b7 Hecate\u2019s Channel Opened",
        body: "Mariah Drennan re-establishes the Moon-Bride tradition after three hundred years of targeted suppression. Cody Hatton is her partner \u2014 first male Moon-Bride partner in recorded history. The Moon-Bride addendum to the Pike County compact ratified. Hecate \u2014 Gaia\u2019s daughter, holding the Darkness back from the Veil\u2019s edge \u2014 is no longer transmitting into an empty room. <em>She has been transmitting for three hundred years with no one to receive.</em>",
        chars: ["Mariah Drennan", "Cody Hatton", "Hecate"],
        color: "#4a8c4a" },
    { era: "y4", sort: 4200, key: true,
        date: "Year 4", dateSub: "WW3 \u00b7 The Web Itself",
        book: "WW3",
        title: "Web Compact Ratified \u00b7 Edna Mae the Omni Witch \u00b7 Earth Mother Speaks",
        body: "Edna Mae Calhoun revealed as the second Omni Witch in history (the first: Arcadia). The Web Compact ratified: daughters\u2019 practice primary, formal framework downstream, Moon-Bride channel recognized, lateral connections permanently restored. The Earth Mother\u2019s first direct statement in the human-recorded era: <em>My daughters are awake. They will not be silenced again.</em>",
        chars: ["Edna Mae Calhoun", "The Earth Mother", "443 Practitioners"],
        color: "#4a8c4a" },
    // ──────── YEAR 5 ────────
    { era: "y5", sort: 5000, key: true,
        date: "Year 5", dateSub: "OS1 \u00b7 The Oath Breaker",
        book: "OS1",
        title: "Cassius Vale Defects \u00b7 First Defector \u00b7 June\u2019s Fifteen-Year Dream",
        body: "June Tackett has been recording Solomon Vale in her dream record for fifteen years. He arrives at the Hollow Diner on a Tuesday. She says: <em>I\u2019ve been seeing you in my dreams since I was nineteen. Sit down.</em> Sixteen days. The oath-refusal spoken in the warm room. The 203-year binding tears. He retrieves his name: Cassius.",
        chars: ["Cassius Vale", "June Tackett", "Kokabiel", "Carla June"],
        color: "#991b1b" },
    { era: "y5", sort: 5100, key: true,
        date: "Year 5", dateSub: "OS2 \u00b7 The Silent Sister",
        book: "OS2",
        title: "Saraqael & Vania \u00b7 Vatican Sub-Levels \u00b7 Seal Fragment Recovered",
        body: "Saraqael enters the Vatican\u2019s secret library. Vania \u2014 80 years of chosen silence, 40 years waiting for a witness \u2014 is already there. She signs one word in the oath-language: <em>witness.</em> Two weeks, 32 notes. The seal fragment recovered. Her first spoken word in 80 years: his name.",
        chars: ["Saraqael", "Vania", "The Seal Fragment"],
        color: "#991b1b" },
    { era: "y5", sort: 5200, key: true,
        date: "Year 5", dateSub: "OS3 \u00b7 The Architect\u2019s Daughter",
        book: "OS3",
        title: "Marisol Drake Defects \u00b7 600-Year Archive Delivered",
        body: "Marisol Drake (Barbatos\u2019s daughter, the Order\u2019s ritual architect) comes to Pike County to design the binding for Brian Lee\u2019s sacrifice. He pours her coffee. Asks if she wants anything else. Means the question. She finds the word <em>sacrifice</em> in the commission documentation. She packs the complete 600-year Order archive and walks it into the Hollow Diner. <em>I think these belong to you.</em>",
        chars: ["Marisol Drake", "Brian Lee Combs", "Barbatos"],
        color: "#991b1b" },
    { era: "y5", sort: 5300, key: true,
        date: "Year 5 \u00b7 August\u2013October", dateSub: "OS4 \u00b7 The Last Assassin",
        book: "OS4",
        title: "Anselm\u2019s Testimony \u00b7 Six Weeks \u00b7 October: Anselm Dies",
        body: "Anselm (612 years old, last of the founding generation) walks to Edna Mae\u2019s kitchen in August. Six weeks of testimony to Pearlene: the Segovia names, the seventh woman who was still finding her frequency, the weight the document cannot carry.\n\nOctober: Anselm dies on Edna Mae\u2019s back porch. The Mother receives him. Buried at the Maelin cemetery beside Tom Maelin. <em>Two men who held their positions until the end and died in the right place.</em>",
        chars: ["Anselm", "Pearlene Calhoun", "Edna Mae Calhoun", "Tom Maelin"],
        color: "#991b1b" },
    { era: "y5", sort: 5400, key: true,
        date: "Year 5 \u00b7 April \u00b7 3 AM", dateSub: "OS5 \u00b7 The War for the World",
        book: "OS5",
        title: "Satan Sealed \u00b7 Lucifer\u2019s Sacrifice \u00b7 The Succession",
        body: "April. 3 AM. Wednesday. 443 practitioners. Every Watcher-witch couple. Mama Calhoun\u2019s ghost present. Six Wardens fly. Brian Lee holds the Leviathan\u2019s geological frequency as the ritual\u2019s foundation.\n\nThe Mother speaks.\n\nSatan sealed into the Catholic Church\u2019s dissolved institutional structure. The Church dissolves. Lucifer walks into the seal as its binding agent \u2014 the Prince of Pride who built the Order to maintain his brother\u2019s prison becomes the prison\u2019s permanent anchor.\n\nEdna Mae passes the senior anchor seal to Pearlene: <em>The work continues. But not by me.</em>\n\nLate May: children in the yard. The world exhales.",
        chars: ["443 Practitioners", "Satan", "Lucifer", "Edna Mae", "Pearlene", "Brian Lee", "Marisol Drake", "All Six Wardens"],
        color: "#991b1b" },
    // ──────── PENITENT'S ROAD ────────
    { era: "pr", sort: 5050, key: false,
        date: "Year 5 \u00b7 Parallel", dateSub: "P1 \u00b7 The Penitent\u2019s Road",
        book: "P1",
        title: "Dantalion Arrives at Edna Mae\u2019s Studio \u00b7 First Penitent",
        body: "Edna Mae has been painting Dantalion\u2019s face for six months \u2014 the Omni Witch gift saw him coming. He arrives. He does not know she has already seen him. The first penitent defection: a demon who chose the correct version of his own gift.",
        chars: ["Dantalion", "Edna Mae Calhoun"],

    { era: "pr", sort: 5150, key: false,
        date: "Year 5 \u00b7 Parallel", dateSub: "P2 \u00b7 The Penitent\u2019s Road",
        book: "P2",
        title: "Gremory Restores the Bray Land \u00b7 93 Years Reversed",
        body: "Gremory walks 400+ acres for 18 days, reading three generations of wrongful taking in the geological record. He combines the geological evidence with Willa Bray\u2019s nine-year legal argument. He uses the last of his restoration gift as a free choice. The Bray land returns after 93 years. Mammon\u2019s 1923 operation directly reversed. <em>They couldn\u2019t take that.</em>",
        chars: ["Gremory", "Willa Bray", "Mammon"],
        color: "#c2410c" },
    { era: "pr", sort: 5250, key: false,
        date: "Year 5 \u00b7 Parallel", dateSub: "P3 \u00b7 The Penitent\u2019s Road",
        book: "P3",
        title: "Murmur Translates Celestine \u00b7 Veil Maintenance Restored \u00b7 Taia Joins the Web",
        body: "Murmur translates three hours of Celestine Mountainjoy\u2019s seventeen-year urgency: the Darkness is the Veil deteriorating; the Veil-maintenance ceremony was lost in the Reconstruction era suppression; here is the technique. Taia runs the ceremony at the new moon. Celestine finally heard. Taia joins the lateral Web. <em>The water endures. So do we.</em>",
        chars: ["Murmur", "Taia Mountainjoy", "Celestine Mountainjoy"],
        color: "#c2410c" },
    // ──────── YEAR 6+ ────────
    { era: "y6", sort: 6000, key: true,
        date: "Year 6 \u00b7 DA1", dateSub: "The Destruction",
        book: "DA1",
        title: "The Darkness Repeats the Original Lie \u00b7 Hecate Displaced \u00b7 The Veil Dissolves",
        body: "The cascade from Satan\u2019s sealing gives the Darkness the moment it has been waiting for since the origin. It uses the only technique it has ever needed: the voice that sounds like Gaia, the promise of home just past the failing boundary. <em>Hecate moves toward it.</em> The long-deteriorating Veil finally comes down in her absence. The Moon goes silent. Every practitioner, Watcher, and corridor anchor feels it simultaneously. Gaia screams across creation. The arc begins in the silence after.",
        chars: ["Hecate", "The Darkness", "Gaia", "Mariah Drennan"],
        color: "#7c3aed" },
    { era: "y6", sort: 6050, key: true,
        date: "Volume 21 \u00b7 Page 42", dateSub: "June\u2019s Prophetic Record",
        book: "DA1\u2013DA5",
        title: "\u201cShe Is Transmitting. She Can Be Found.\u201d",
        body: "June Tackett\u2019s prophetic record. The last entry before the arc\u2019s active operation. Two sentences. The High Priestess Archive thread carrying what Hecate is transmitting from the Unwritten through the Moon-Bride channel into June\u2019s record. Hecate has been in the dark before. She knows how to send a signal.",
        chars: ["June Tackett", "Hecate", "Mariah Drennan"],
        color: "#7c3aed" },
    { era: "y6", sort: 6300, key: false,
        date: "DA5", dateSub: "The Prophecy",
        book: "DA5",
        title: "June Receives Hecate\u2019s Coordinates \u00b7 The High Priestess Speaks at Full Power",
        body: "The Moon-Bride channel amplifies the Star\u2019s signal. June Tackett receives the full prophetic record from the High Priestess for the first time at complete power. The prophecy names the cost before the search begins. The arc shifts from reactive to intentional. The star Kokabiel named before it was needed points at the coordinates.",
        chars: ["June Tackett", "Mariah Drennan", "Kokabiel"],
        color: "#7c3aed" },
    { era: "y6", sort: 6800, key: true,
        date: "DA8", dateSub: "The Claiming",
        book: "DA8",
        title: "The Claiming \u00b7 The Bond at Full Arcana Level \u00b7 Hecate Reached",
        body: "The Darkness separated Hecate from Gaia with a lie. The Claiming is the answer to the first lie \u2014 not a counter-argument but the correct action taken by the correct people at the correct moment. The Watcher-witch compacts, the Familiar bonds, the daughters\u2019 Web Compact, the Moon-Bride channel \u2014 all active simultaneously. Hecate chosen back into existence by the accumulated weight of every bond built in her mother\u2019s world. The force the Darkness never found a way to lie away.",
        chars: ["Hecate", "Full Network", "The Lovers Arcana", "Strength Arcana"],
        color: "#7c3aed" },
    { era: "y6", sort: 7000, key: true,
        date: "DA10", dateSub: "The Resurrection",
        book: "DA10",
        title: "Judgement Calls \u00b7 Hecate Returns \u00b7 Changed",
        body: "Judgement calls. The Sun burns at full strength for the first time since the arc began. Hecate returns \u2014 but not unchanged. She was in the deep places. The dark was in her. What she brings back is not exactly the Hecate who was lost. The Veil cannot be the same Veil. This is the pivot. Everything after is different.",
        chars: ["Hecate", "The Sun", "Judgement", "Brian Lee"],
        color: "#7c3aed" },
    { era: "y6", sort: 7200, key: true,
        date: "Year 7 \u00b7 Fire Solstice", dateSub: "DA12 \u00b7 The Restoration",
        book: "DA12",
        title: "Gaia and Hecate \u00b7 The Fire Solstice \u00b7 The Seven-Year Cycle Closes",
        body: "The same fire solstice. Seven years after Dixie ratified the compact on the longest day of Year 0 \u2014 the same solar position, the same Older Mechanism calendar point, the same day the compact\u2019s record was first opened \u2014 the Restoration happens.\n\nGaia and Hecate. The reunion. The Darkness told Hecate her mother\u2019s warmth was a cage. The Restoration answers that lie in its most complete form: Hecate does not return to the boundary\u2019s edge. She returns to Gaia.\n\nThe new Veil grows from what survived the arc \u2014 not reconstructed but built from the work done in the dark. The Bond is its foundation. The daughters\u2019 Web is woven through it. The compacts are its structure. The mortal world is not outside it. It is woven into it.\n\n<em>The fire solstice. The sun at its peak. The compact\u2019s record opened on this day and the Restoration closes it on this day. Seven years. The Darkness\u2019s first lie finally answered.</em>",
        chars: ["Hecate", "Gaia", "The Full Network", "Dixie Calhoun"],
        color: "#7c3aed" },
