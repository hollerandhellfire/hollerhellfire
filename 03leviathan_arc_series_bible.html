    { t: "The Leviathan's Origin \u2014 Gaia's First Creation", c: "gd", body: "The Leviathan is not a monster that arrived later. He is <strong>Gaia's first real creation</strong> \u2014 made when the child <strong>Hecate</strong> took a life-seed from her mother's Garden without asking, shaped clay to resemble the primordial beast <strong>Agron</strong>, and the clay moved, opened its eyes, stood, and smiled. She named him Leviathan. Her best friend.\n\n<strong>Agron is the First of the twelve Nasilin</strong> \u2014 the Gates, the primordial beasts who serve only the Bone Mother \u2014 a dragon big enough to swallow a planet. The Leviathan was modeled on that first Gate. So the oldest living thing beneath Pike County is, at its root, a child's act of love shaped after the deepest primordial architecture: Gaia's first creation, formed in the image of the Bone Mother's first Gate. <em>(See the Nasilin faction bible and The Codex.)</em>" },

    { t: "Satan's Architecture \u2014 The Prison Lock", c: "cr", body: "The wrong compact was not merely an incorrect version of the Familiar bond's architecture. It was <strong>Satan's prison lock</strong>.\n\nSatan \u2014 the Giant Red Dragon, Prince of Wrath \u2014 killed Arcadia in 12,000 BCE after the first correct compact was established. His wrath at the Leviathan's choosing was the event that required his sealing. The Leviathan's position above him was the seal's geological foundation: suppressing the Leviathan suppressed the frequency that maintained the seal.\n\nSatan told the other six Princes that the wrong compact was Hell's greatest weapon against mortal practitioners. It was not. It was the maintenance structure of his own prison. The Princes preserved it for twelve thousand years while Satan waited for natural degradation to free him.\n\nWhen the New Compact is ratified in WMB6, Satan's seal substrate fails. His operation in Year 5 (Order of Shadow arc) is his bid to complete his escape before the network can seal him again. He does not succeed. <strong>He is sealed into the Catholic Church's dissolved institutional structure in OS5.</strong> The Church is gone. The seal holds where the Church was." },
    { t: "The Wrong Compact", c: "cr", body: "Twelve thousand years of fear-and-control architecture with a dual function: suppressing the daughters' practice in the mortal layer <em>and</em> maintaining the geological suppression of the Leviathan above Satan's sealed position. The Church's institutional architecture of guilt and compliance was the closest mortal-layer equivalent to Satan's specific wrath-substrate.\n\nLucifer built the Order of Shadows in 1414 to maintain the seal's institutional housing \u2014 dressed as Hell's weapon so the Princes would protect it. The arc refuses the wrong compact explicitly: not by destroying the structure but by replacing it with the correct one. This is the specific mechanism that allows Satan's seal to degrade: the correct compact removes the wrong compact's fear-substrate, which removes the seal's maintenance architecture." },
    { t: "The Horde", c: "wt", body: "The Leviathan's extended geological family. Methane wyrms (blue-white fire, three hundred million years old). Rock dragons (twelve-thousand-year sleep, disoriented by interstates). Coal seam entities. The fault line that ruptures in WMB1 was <strong>Haagenti's preparation</strong> \u2014 four decades of systematic industrial extraction along the fault line he identified and weakened. The Horde's emergence through it is disorientation, not invasion. Samyaza mediates. Brian Lee translates." },
    { t: "The Ley Line Network", c: "tl", body: "The seven Warden positions are connected by primary Ley Lines. Three of Ravos's seventeen identified thread locations are at secondary Ley Line nodes between Warden positions \u2014 not at the Warden positions themselves but at intersection points where the connections between positions run strongest." },
    { t: "The New Compact's Frequency", c: "gd", body: "The compact moves through the Church's institutional architecture like <em>a key in a lock that has been cut to fit a different door.</em> Satan's fear-and-control substrate \u2014 the prison lock's maintenance architecture \u2014 destabilizes. He built his operation in a distorted-Web environment. He is now in a correctly-constituted-Web environment. The adaptation takes time. Lucifer, who built the Order to maintain the seal, understands before the other Princes do what the New Compact means.\n\nMetatron: <em>the formal framework is downstream of the Web. Always was. The compact makes that explicit.</em>" },
];
