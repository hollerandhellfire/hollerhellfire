@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}

/* \u2500\u2500 The First Two Palette: cold blue and warm gold \u2500\u2500 */
/* Cold deep blue. The specific color of the space where warmth   */
/* has never been. Not black \u2014 black is the absence of light.    */
/* This is the presence of something that has decided warmth      */
/* is a cage. It is the wrong decision, held for thirty thousand  */
/* years with absolute conviction.                                */

.db{max-width:960px;margin:0 auto;padding:32px 18px 80px;background:#070b14;min-height:100vh;color:#d8e0f0;font-family:'Cormorant Garamond',Georgia,serif;}
.hd{text-align:center;padding:54px 0 40px;border-bottom:1px solid #2a3752;margin-bottom:36px;position:relative;overflow:hidden;}
.hd::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 100%,rgba(30,58,95,.15) 0%,transparent 70%);pointer-events:none;}
.hd::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,#1e3a5f 30%,#6f9bd6 50%,#1e3a5f 70%,transparent);}
.hd-lbl{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.45em;color:#6f9bd6;text-transform:uppercase;margin-bottom:14px;}
.hd-title{font-family:'Cinzel Decorative',serif;font-size:clamp(24px,6vw,52px);font-weight:700;color:#d8e0f0;line-height:1.05;margin-bottom:8px;text-shadow:0 0 80px rgba(30,58,95,.8),0 2px 40px rgba(10,20,40,.9);}
.hd-sub{font-family:'Cinzel',serif;font-size:clamp(9px,2vw,13px);color:#8fb0e0;letter-spacing:.28em;margin-bottom:20px;}
.hd-tag{font-style:italic;font-size:14px;color:#8095b5;max-width:640px;margin:0 auto;line-height:1.9;}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:28px;border-bottom:1px solid #2a3752;padding-bottom:12px;}
.tab{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;padding:6px 12px;border:1px solid #2a3752;background:transparent;color:#8095b5;cursor:pointer;transition:all .2s;}
.tab:hover{border-color:#6f9bd6;color:#9fb6d8;}
.tab.active{background:rgba(30,58,95,.25);border-color:#6f9bd6;color:#d8e0f0;}
.sec{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:#6f9bd6;margin:24px 0 14px;padding-bottom:7px;border-bottom:1px solid #2a3752;}
.pull{border-left:3px solid #1e3a5f;padding:14px 18px;background:rgba(30,58,95,.08);margin:14px 0;font-size:14px;font-style:italic;line-height:1.88;color:#d8e0f0;}
.pull.gaia{border-left-color:#4a8c4a;background:rgba(74,140,74,.05);}
.pull.hecate{border-left-color:#94a3b8;background:rgba(148,163,184,.05);}
.pull.warm{border-left-color:#c9943a;background:rgba(201,148,58,.05);}
hr{border:none;border-top:1px solid #2a3752;margin:20px 0;}
.orn{text-align:center;font-size:14px;color:#6a7fa0;margin:18px 0;letter-spacing:14px;}

/* DOCTRINE CARDS */
.dc{background:#0d1322;border:1px solid #2a3752;border-left:3px solid #1e3a5f;padding:16px 20px;margin-bottom:11px;}
.dc.cold{border-left-color:#6f9bd6;}
.dc.void{border-left-color:#6a7fa0;background:rgba(40,55,90,.35);}
.dc.warm{border-left-color:#c9943a;}
.dc.gaia{border-left-color:#4a8c4a;}
.dc.hecate{border-left-color:#94a3b8;}
.dc.cr{border-left-color:#d05a5a;}
.dc.defeat{border-left-color:#8a6fd0;background:rgba(124,58,237,.04);}
.dc-lbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.35em;color:#6a7fa0;text-transform:uppercase;margin-bottom:5px;}
.dc-t{font-family:'Cinzel',serif;font-size:15px;color:#d8e0f0;margin-bottom:6px;line-height:1.3;}
.dc-b{font-size:13px;line-height:1.78;color:#aab8d4;}
.dc-b em{color:#d8e0f0;font-style:italic;}
.dc-b strong{color:#9fb6d8;font-weight:600;}
.dc-b strong.gaia{color:#86efac;}
.dc-b strong.hecate{color:#cbd5e1;}
.dc-b strong.warm{color:#e8c06a;}
.dc-b strong.cr{color:#f87171;}
.dc-b strong.pu{color:#c4b5fd;}

/* TIMELINE */
.tl-row{display:grid;grid-template-columns:130px 14px 1fr;gap:0 14px;margin-bottom:8px;align-items:start;}
.tl-date{text-align:right;padding-top:13px;}
.tl-date-main{font-family:'Cinzel',serif;font-size:11px;color:#6f9bd6;letter-spacing:.1em;line-height:1.3;}
.tl-date-sub{font-size:10px;color:#8095b5;font-style:italic;margin-top:2px;}
.tl-spine{display:flex;flex-direction:column;align-items:center;padding-top:11px;}
.tl-dot{width:11px;height:11px;border-radius:50%;border:2px solid #1e3a5f;background:transparent;flex-shrink:0;z-index:1;}
.tl-dot.key{width:14px;height:14px;background:#1e3a5f;border-color:#8fb0e0;}
.tl-line{width:2px;flex:1;min-height:8px;margin-top:2px;background:#1e3a5f;opacity:.2;}
.tl-card{background:#0d1322;border:1px solid #2a3752;border-left:3px solid #1e3a5f;padding:12px 16px;margin-bottom:4px;}
.tl-title{font-family:'Cinzel',serif;font-size:13px;color:#d8e0f0;margin-bottom:4px;}
.tl-body{font-size:12px;line-height:1.62;color:#aab8d4;}
.tl-body em{color:#d8e0f0;font-style:italic;}

/* RELATIONSHIP CARDS */
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px;margin-top:12px;}
.rel{background:#0d1322;border:1px solid #2a3752;border-top:3px solid #1e3a5f;padding:14px 16px;}
.rel-name{font-family:'Cinzel',serif;font-size:14px;color:#d8e0f0;margin-bottom:3px;}
.rel-type{font-size:10px;font-style:italic;color:#6f9bd6;margin-bottom:7px;letter-spacing:.05em;}
.rel-b{font-size:12px;line-height:1.62;color:#aab8d4;}
.rel-b em{color:#d8e0f0;font-style:italic;}
.rel-b strong{font-weight:600;}
.rel-key{margin-top:8px;padding-top:7px;border-top:1px solid #2a3752;font-size:11px;font-style:italic;color:#8fb0e0;}

/* VOICE DISPLAY */
.voice-box{background:#111a2c;border:1px solid #6f86ac;border-left:3px solid #6f86ac;padding:16px 20px;margin:14px 0;font-size:14px;font-style:italic;line-height:1.9;color:#a9bbd8;}
.voice-box .speaker{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.3em;color:#7f95b8;text-transform:uppercase;margin-bottom:8px;display:block;}
.voice-box .the-lie{color:#8fb0e0;font-style:italic;}
.dc.gold{border-left-color:#c9943a;}
.dc.hecate .dc-b strong{color:#cbd5e1;}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
@media(max-width:760px){.duo{grid-template-columns:1fr;}}
.col-h{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.32em;text-transform:uppercase;padding:8px 12px;margin-bottom:12px;border-bottom:2px solid;}
.col-h.n{color:#8fb4ee;border-color:#3f6ba8;background:rgba(63,107,168,.12);}
.col-h.s{color:#fbbf24;border-color:#c9943a;background:rgba(245,158,11,.1);}
.draft{display:inline-block;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#fbbf24;border:1px solid rgba(251,191,36,.45);padding:1px 6px;margin-left:6px;vertical-align:middle;}
.cmp{margin:16px 0;border:1px solid #2a3752;}
.cmp-row{display:grid;grid-template-columns:110px 1fr 1fr;border-bottom:1px solid #2a3752;font-size:13px;line-height:1.55;}
.cmp-row:last-child{border-bottom:none;}
.cmp-k{padding:10px 12px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#7f95b8;background:#0d1322;}
.cmp-n{padding:10px 12px;color:#aab8d4;background:rgba(63,107,168,.07);}
.cmp-s{padding:10px 12px;color:#e8d9b0;background:rgba(245,158,11,.06);}
@media(max-width:640px){.cmp-row{grid-template-columns:1fr;}}
.who{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;padding:2px 8px;margin-right:6px;border:1px solid;font-style:normal;}
.who.n{color:#8fb4ee;border-color:#3f6ba8;}.who.s{color:#fbbf24;border-color:#c9943a;}.who.b{color:#c4b5fd;border-color:#8a6fd0;}
.tl-dot.N{border-color:#3f6ba8;}.tl-dot.N.key{background:#3f6ba8;}
.tl-dot.S{border-color:#f59e0b;}.tl-dot.S.key{background:#f59e0b;}
.tl-dot.both{border-color:#8a6fd0;}.tl-dot.both.key{background:#8a6fd0;}
.tl-card.N{border-left-color:#3f6ba8;}.tl-card.S{border-left-color:#f59e0b;background:#17150f;}.tl-card.both{border-left-color:#8a6fd0;}
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;}
.q-card{background:#0d1322;border:1px solid #2a3752;border-top:3px solid #8a6fd0;padding:14px 16px;}
.q-tag{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#c4b5fd;margin-bottom:6px;}
.q-t{font-size:14px;line-height:1.65;color:#d8e0f0;}
.dc.defeat .dc-t{color:#d8e0f0;}
`,F0=[{id:"twins",l:"The Twins"},{id:"nature",l:"Nature"},{id:"origin",l:"Origin"},{id:"method",l:"Method"},{id:"arc",l:"Timeline"},{id:"relationships",l:"Relationships"},{id:"defeat",l:"Claiming \xB7 After"},{id:"questions",l:"Development Questions"}],$0=[{name:"Sano \xB7 The Sun",col:"#f59e0b",type:"His Twin \xB7 The Brother Who Has Everything",b:"Sano. Croatian for Enlightened. His twin. The Sun Arcana's living expression in the mortal layer. Married to Gaia. Father of Hecate. The being who, in Nepisano's perception, has everything Nepisano was denied: recognition in the cosmological order, love, relationship, a daughter who is the threshold between the living world and the dark.<br/><br/>Nepisano watches Sano from the deepest Unwritten. He has been watching for longer than the daughters' practice has had language for watching. He borrowed Sano's daughter to get closer to what Sano has. He told himself it was about the boundary, about the Veil, about the mortal layer's expansion. It was about his brother.<br/><br/><em>He only thinks Sano rejected him. The Prequel arc will answer whether there was ever a real wrong done, or only a wound that a twin catastrophized into exile.</em>",key:""},{name:"Hecate",col:"#94a3b8",type:"Thirty Thousand Years \xB7 His Oldest Operation \xB7 His Only Unresolved Calculation",b:"She is Sano\u2019s daughter. Gaia\u2019s daughter. His niece. He knew this when he found her at the boundary\u2019s edge. He knew it when he told her the warmth was a cage. The lie he told her was also the lie he tells himself about her father. She is the reflection of the brother he says rejected him. He was not deceiving a stranger. He was stealing his brother\u2019s daughter from his brother\u2019s wife because he could not have what his brother had, and she was close enough to count. That is not a failure on her part \u2014 it is the specific measure of how precisely he listens. He calibrated the borrowed frequency to thirty thousand years of her longing for Gaia\u2019s voice. No being could have resisted that calibration.<br/><br/>He holds her in the Unwritten not to destroy her. He needs her intact. She is the only being in the universe capable of re-establishing the Veil from the outside. If he can expand enough before she finds a way out \u2014 or before the network reaches her \u2014 a new Veil would have nothing left to protect. That is the calculation. Keep her. Expand. Reach the point of no return before the Claiming happens.<br/><br/><em>He underestimates one specific variable in this calculation: she has been in the dark before. She knows how to send a signal.</em>",key:"He needs her intact. She is not passive. She is already transmitting."},{name:"Gaia",col:"#4a8c4a",type:"He Has Never Spoken to Her \xB7 He Has Borrowed Her Voice",b:"He has listened to Gaia\u2019s specific frequency for thirty thousand years. He knows what she sounds like to Hecate better than almost anyone in the universe. He reproduced that frequency precisely in DA1 and it worked.<br/><br/>He has never spoken to Gaia directly. He has never tried. Gaia\u2019s frequency in the mortal layer is the one frequency that cannot be used against her \u2014 she is the Earth itself, the thirty-thousand-year practice\u2019s source, the Empress Arcana\u2019s domain. He cannot lie her away from the daughters\u2019 practice because she is the daughters\u2019 practice.<br/><br/><em>This is the theological irony: the being he most used is also the being he cannot touch. He stole her daughter\u2019s voice to do it.</em>",key:"He borrowed her voice. He cannot use his technique on her."},{name:"The Practitioners",col:"#c9943a",type:"His Unwitting Long-Term Operation",b:"He did not design the wrong compact\u2019s isolation era. But every practitioner who practiced alone for three thousand years was running at a frequency adjacent to his. He listened to each of them. He built the profile of what isolated practitioners most want \u2014 connection, recognition, confirmation that the practice is real and that they are not alone in it.<br/><br/>He never approached most of them directly. He didn\u2019t need to. The isolation did his work for him. He was waiting for a practitioner with enough reach \u2014 a Hecate-equivalent, a being at a boundary between his domain and everything else \u2014 to approach.<br/><br/><em>The 443 in lateral contact after WW1 is the specific event that removes the practitioners from his operational range. Connected practitioners are not running at the isolation frequency. They are running at the Web\u2019s frequency. He cannot find purchase there.</em>",key:"The 443 is the specific operational loss that precedes his final operation."},{name:"Satan",col:"#991b1b",type:"No Relationship \xB7 Extremely Useful Data",b:"He watched Satan more carefully than any other member of the Hell faction. Not out of alliance \u2014 Satan\u2019s wrath is exactly the kind of force that operates without calculation, and he finds uncalculated force uninteresting. But Satan\u2019s twelve-thousand-year operation created conditions that were specifically useful to his calculation.<br/><br/>The wrong compact\u2019s fear-substrate weakened the boundary over millennia. The New Compact\u2019s ratification destabilized Satan\u2019s seal substrate. Satan\u2019s sealing produced the cascade. Every step in Satan\u2019s arc \u2014 from killing Arcadia to being sealed into the Church\u2019s dissolved structure \u2014 was a data point in his calculation.<br/><br/><em>Satan never knew he was being used. Satan never knew there was anything beyond the Arcana layer\u2019s boundary worth considering. That incuriosity was the most useful thing about him.</em>",key:"Satan\u2019s arc from 12,000 BCE to OS5 was thirty-seven thousand years of useful data."},{name:"Lucifer",col:"#c4b5fd",type:"The One He Watched Most Carefully",b:"Lucifer built the Order of Shadows in 1414 to maintain Satan\u2019s prison through the Church\u2019s institutional structure. He dressed the Order as Hell\u2019s weapon so the Princes would protect it. He spent six hundred years maintaining the lie.<br/><br/>This is the operation he watched most carefully, because it is structurally identical to his own: a being using a borrowed purpose to maintain a structure that serves a different function than anyone in it believes. The Darkness recognized his own technique in Lucifer\u2019s architecture. It was not affinity. It was recognition.<br/><br/><em>Lucifer\u2019s ultimate sacrifice \u2014 walking into the seal as its binding agent \u2014 was the specific event he had not calculated. A being choosing freely to give themselves to the correct thing rather than the institutional thing. He had not seen that data point before. He filed it.</em>",key:"Lucifer\u2019s sacrifice was the one variable he did not predict."},{name:"Abaddon \xB7 The Abyss",col:"#64748b",type:"The Door He Cannot Avoid \xB7 The Soul He Could Not Use",b:"Abaddon is the one being in the cosmological order Nepisano cannot calculate around. The deal with Sano makes Abaddon the keeper of the only road that matters: Abaddon was charged with keeping Nepisano from Hecate, and the Abyss sits between the deepest Unwritten and Hell, so every time Nepisano moves toward the world he must pass through Abaddon\u2019s domain. There is no route that avoids him.<br/><br/>And unlike everything else in Hell, Abaddon cannot be turned by the cold or bent by an operation. He is in Hell willingly, holding himself entirely, lent the power to do it by a deal Nepisano was never party to. He is not a soul Nepisano can borrow a voice for. He is not longing for anything Nepisano can imitate. He simply stands at the door.<br/><br/><em>So when Nepisano finally returns from the Unwritten to Hell, he stops in the Abyss. He finds Abaddon. He looks at him. And he says only one thing:</em>",key:"\u201CComing\u2026?\u201D \u2014 The deal said Abaddon would keep him from Hecate. It did not say what the two of them would be to each other once that was already done."},{name:"The Claiming",col:"#8a6fd0",type:"The Event He Could Not Counter",b:"He expected a response. He had calculated a range of possible responses to the Veil\u2019s dissolution. He expected the network to attempt reconstruction. He expected Gaia to attempt direct intervention. He expected Heaven\u2019s formal framework to mobilize.<br/><br/>He did not predict the specific architecture of the Claiming: the accumulated weight of every correct bond built in Gaia\u2019s daughters\u2019 world, invoked simultaneously through the Lovers Arcana, functioning not as an assault on his position but as a statement about the nature of relationship that makes his premise untenable.<br/><br/><em>He cannot counter the Claiming because the Claiming is not an argument. It is not a competing lie. It is the correct action. The lie works against longing. It has no purchase against demonstrated love.</em>",key:"He could not counter it. He could only watch his premise be disproved."}],I0=[{name:"Nepisano",col:"#6f9bd6",type:"His Twin \xB7 The Relationship Everything Grew From",b:"Gemini twin and beloved brother. Nepisano was the voice of reason who calmed the assembly when Sano was overwhelmed, and the first person Sano ever ruled beside. Sano still wants him back. His instruction in the deal is not <em>find him</em>; it is <em>bring him back whole, but not before then.</em><br/><br/><em>Whether Sano knows his brother was lied to is an open question.</em>",key:"The first relationship in the universe is still the one that decides everything."},{name:"Gaia",col:"#4a8c4a",type:"His Queen \xB7 The First Choosing",b:"The crying stranger. He heard her when no one else could and made her a place to plant her seed. He wooed her, which she did not expect, and she said yes: <em>the first relationship built on trust and belief.</em> Her seed in every sphere, her World Tree, and her daughters' practice are what the Wall is bound to.",key:"His warmth and her seed are the two halves of every living thing."},{name:"Hecate",col:"#94a3b8",type:"His Daughter \xB7 The Moon",b:"A perfect reflection of her father with her mother's beauty. Her frequency matches his so strongly that her flash destroyed the corruption in his brother. She takes post on the wall where the Tower watches Gaia's Garden, stubborn. He lets her.<br/><br/><em>He lent her his light before she knew she had it. He has never been sure what to say about what it cost her.</em>",key:"Her light saved his brother and broke him anyway."},{name:"Abaddon",col:"#64748b",type:"The One He Trusted \xB7 The Deal",b:"The first human to cross to the Arcana Layer. Sano offered to adopt his twins in exchange for bringing Nepisano home whole. In doing so he gave a dying mortal the one task the Sun cannot do: walk into the cold and not be changed by it.",key:"Sano cannot go where Abaddon goes. That is why he asked."},{name:"Celeste and Lyrica",col:"#c9943a",type:"His Adopted Daughters \xB7 The First Weavers",b:"Abaddon and Arcadia's twins, adopted by Gaia under Sano's protection. Their protection is the Web compact. The Wall he built with the energy of their parents' deaths is the roof over their heads.",key:"The first debt the Sun ever took on, and the one he cannot repay."},{name:"The Dzin and the Susti",col:"#e0953a",type:"His Guard and Gaia's Handmaidens",b:"The seven meta-titans who took Mercury and guarded the twins, and the seven untouched who maintain the Garden. Sano sends the Dzin after Cain, and the Dzin run shifts on the wall beside Hecate. Force is available to him, which is why the way he uses it matters.",key:"The Light has a standing army. It has used it once in grief."},{name:"Cain \xB7 Lucifer",col:"#d05a5a",type:"The One He Marked",b:"Cain killed Abel at Babel and Arcadia in the Familiar Bond ritual. Sano, still mourning his brother, sent the Dzin to mark him with three slashes and drive him from the sun. Nepisano then gave him a job and a name. <em>The two brothers' first disagreement about a human soul.</em>",key:"Sano marked him. Nepisano named him. Neither reached him first."},{name:"The Davos",col:"#8a6fd0",type:"The Faction That Found the Gap",b:"The twelve bars who took frozen Pluto, because the seed did not take and they felt tricked. They could not stand Sano's light and responded to Nepisano's cool logic. Andras whispered the first lie. They return in every cycle, more aggressive and more numerous, until the seventh.",key:"The Light can fight them. It cannot make them stop whispering."}],qu=()=>(0,o.jsx)("span",{className:"draft",children:"draft \xB7 confirm"}),xu=({n:e,s:t})=>(0,o.jsxs)("div",{className:"duo",children:[(0,o.jsxs)("div",{className:"col n",children:[(0,o.jsx)("div",{className:"col-h n",children:"Nepisano \xB7 The Darkness"}),e]}),(0,o.jsxs)("div",{className:"col s",children:[(0,o.jsx)("div",{className:"col-h s",children:"Sano \xB7 The Sun"}),t]})]}),ee=({c:e="cold",lbl:t,t:a,children:l,draft:n})=>(0,o.jsxs)("div",{className:`dc ${e}`,children:[(0,o.jsxs)("div",{className:"dc-lbl",children:[t,n&&(0,o.jsxs)(o.Fragment,{children:[" ",(0,o.jsx)(qu,{})]})]}),(0,o.jsx)("div",{className:"dc-t",children:a}),(0,o.jsx)("div",{className:"dc-b",children:l})]}),P0=[{who:"both",key:!0,date:"Before Time",dateSub:"The first relationship",title:"Light and Darkness \xB7 Frequency Collected into Being",body:"Nepisano is the Darkness, who resides in the Unwritten; Sano is the Light, his Gemini twin and beloved brother. Sano is always full of energy and drawing others to him."},{who:"S",key:!0,date:"The Bang",dateSub:"Eleven spheres",title:"A Crying Stranger \xB7 Sano Makes a Universe",body:"Sano meets Gaia crying: she has nowhere to plant her seed of life. He pulls the space dust together so hard it makes a huge bang, and it separates into ten distinct spheres with an eleventh enclosing everything, even the two of them."},{who:"N",key:!0,date:"The Assembly",dateSub:"The first governance",title:"Nepisano Calms the Crowd",body:"Arcana, Voljeti, Davos, Bone Mother, Sjena, Nasilin, Dzin and Susti shout for answers; Sano is overwhelmed. Nepisano steps in, voice of reason: <em>why not govern instead of fight?</em> He suggests planting Gaia's seed in every sphere. The territories are agreed. The twins rule from the center, day and night. Pluto's seed does not take, and the Davos feel tricked."},{who:"S",key:!0,date:"The First Choosing",dateSub:"Hecate is born",title:"Sano Woos Gaia \xB7 The Moon Is Born",body:"Sano is happy for a while and still wants something. He woos Gaia; she says yes. <em>The first relationship built on trust and belief.</em> Hecate is born, a perfect reflection of her father with her mother's beauty. Sano is named King, Gaia Queen. Nepisano celebrates and gains a night-owl niece who is never afraid of him."},{who:"N",key:!0,date:"The Whisper",dateSub:"Andras",title:"The First Lie \xB7 Nepisano Is Told He Is Forgotten",body:"Hecate grows toward her mother's Creation; Sano is busy. The Davos leader Andras finds Nepisano watching from a distance: <em>They don't love you. Your brother used you. Love is not real. Eventually everyone forgets you.</em> The seed takes. The night grows cold."},{who:"both",key:!0,date:"The Flash",dateSub:"Hell and Heaven",title:"Nepisano Attacks Gaia \xB7 Hecate's Light",body:`Nepisano attacks Gaia for "taking his brother away." Hecate's frequency, matching her father's, flashes into his eyes and destroys the corruption; the damage is felt just the same. He flees: <em>Out. I want out of here.</em> Hell builds itself around his mind, Heaven as its balance. Sano arrives to an empty Garden, blazing with fury.`},{who:"both",key:!1,date:"The Fight",dateSub:"The binding spell",title:"The Brothers Meet \xB7 Creation Collapses \xB7 They Reconcile",body:"Nepisano returns to the surface, finds the Dzin, and demands his brother. Sano is already there. Creation was never meant to handle the two of them fighting. As it collapses they reconcile, and the restored bond lets the Bone Mother cast a binding spell on time: seven tries. Six cycles fail to the Davos."},{who:"N",key:!0,date:"Seventh Cycle",dateSub:"Cain at the door",title:"A Name, a Rule, a Job",body:"Cain finds the side door into Hell, alive, with his humanity and his Pride intact. Nepisano offers sanctuary; Cain says no, colorfully. <em>Then how about a job?</em> One rule: <em>Never lose yourself, Lucifer, Prince of Pride and first regent of Hell.</em> Then: <em>I need a break and time to think. Oh, and Satan is here.</em> He is gone."},{who:"S",key:!0,date:"Seventh Cycle",dateSub:"Babel \xB7 the Dzin",title:"Sano Marks Cain \xB7 Mourns His Brother",body:"Cain kills Abel at the festival at Babel. Sano, angered and still mourning the loss of his brother, sends the Dzin after Cain; one slashes his arm in three places, an enchantment that drives him from the sun."},{who:"S",key:!0,date:"Seventh Cycle",dateSub:"Abaddon's second scream",title:"The Deal",body:"Abaddon's scream reaches Sano in the royal palace. He finds a dying man who can see him: the first human to cross to the Arcana Layer. Sano offers to adopt Abaddon's twins as daughters of Gaia in exchange for finding Nepisano and bringing him back <em>whole, but not before then</em>, and for keeping Nepisano from Hecate, who has taken post on the wall."},{who:"S",key:!0,date:"The Wall",dateSub:"The Corridor and the Web",title:"Sano Walls the Mortal Layer",body:"He takes the energy released by Arcadia's and Abaddon's deaths and forms a wall over the rips in the foundation, surrounding the Mortal Layer, unknowing about the two parallel worlds his brother's mind made. The Corridor is its doorway; the Web is the world's recorded memory, a network for Gaia's daughters, bound to her World Tree."}],eb=[{who:"both",key:!0,date:"1414 CE",dateSub:"The locks fail",title:"Satan's Second Sealing \xB7 Vine \xB7 The Order of Shadows",body:"Abaddon seals Satan on Hell's streets; Lucifer, saying <em>He's my responsibility</em>, becomes his warden. In 1414 the locks degrade and Vine proposes the Church as a power source. The Dark Ages begin. Hecate walks the wall at night, missing her uncle."},{who:"both",key:!0,date:"The Commission",dateSub:"The Grigori",title:"The Grigori Fall Through the Corridor",body:"The Voljeti's Great Commission sends the Grigori through a Corridor only 2,000 years old; Azazel's wings are ripped off. Heaven and Hell find the doors, the three factions brawl, and a war of ten thousand years follows, up to Book One."}],tb=[{who:"S",key:!0,date:"DA1 \xB7 Year 6",dateSub:"Hecate vanishes",title:"The Sun Blazes in Grief and Rage",body:"When Hecate vanishes, Sano blazes longer and hotter. When his rage spends and he sets, the unprotected nights belong to Hell."},{who:"S",key:!0,date:"DA10",dateSub:"Full strength",title:"The Sun Burns at Full Strength",body:"The moment his daughter returns from the dark. A father watching for her. (draft) What does he say, and to whom?"},{who:"both",key:!0,date:"DA12 \xB7 Year 7",dateSub:"The Restoration",title:"Hecate Goes Home to Gaia and to Sano",body:"A family reunion at a scale the main series only gestures at. Whether Nepisano is whole is the question the Prequel keeps open."}],ab=[{tag:"Character",q:"Did Sano look for his brother after Hell formed? Between the empty Garden and the moment Abaddon reached him, how long was Nepisano missing, and what did Sano do?"},{tag:"Character",q:"Sano was busy while Nepisano was being lied to. Was there one specific moment he could have turned toward the edge of the room and did not, and does he know it?"},{tag:"Theology",q:"Hecate's light destroyed the corruption but left the wound. Is the Sun's frequency the only thing that can reach Nepisano, or does it need to come through a mortal, 'the most infuriating woman in human existence'?"},{tag:"Mythology",q:"Sano sealed the Mortal Layer unaware of Hell and Heaven. When does he learn they exist, and how does it change what the Wall means to him?"},{tag:"Character",q:"The mark and the Dzin: Sano sent them after Cain in grief and anger. Does he regret it, and does Lucifer's later redemption change how he sees it?"},{tag:"Theology",q:"Abaddon's deal is 'bring him back whole, but not before then.' Who decides whole? Does Sano get a say, or only Nepisano?"},{tag:"Plot",q:"What does Sano say to Nepisano the first time they are in the same room again after the Restoration? One line, in his voice."},{tag:"Continuity",q:"The creation story gives the Corridor as 2,000 years old at the Commission and a 10,000-year war. Earlier canon holds a thirty-thousand-year Web. Which timeline wins?"},{tag:"Continuity",q:"Hecate takes post on the wall after the reconciliation, yet earlier canon has her crossing to the Unwritten and becoming the Veil. Do both happen, and in what order?"},{tag:"Mythology",q:"Do the planets on the Theology Bible map (Earth, Mars and so on) get relabeled to the creation story's assignments: Dzin Mercury, Arcana Venus, Sjena Mars, Voljeti Jupiter and Saturn, Nasilin Uranus, Bone Mother Neptune, Davos Pluto?"}];function Lf(){let[e,t]=(0,dg.useState)("twins");return(0,o.jsxs)(o.Fragment,{children:[(0,o.jsx)("style",{children:W0}),(0,o.jsxs)("div",{className:"db",children:[(0,o.jsxs)("header",{className:"hd",children:[(0,o.jsx)("div",{className:"hd-lbl",children:"Dual Character Bible \xB7 The Holler & Hellfire Universe"}),(0,o.jsx)("h1",{className:"hd-title",children:"The First Two"}),(0,o.jsx)("div",{className:"hd-sub",children:"Nepisano \xB7 The Darkness \xA0|\xA0 Sano \xB7 The Sun"}),(0,o.jsx)("p",{className:"hd-tag",children:(0,o.jsxs)("em",{children:["Before time had meaning there was still Light and Darkness,",(0,o.jsx)("br",{}),"and they were twins.",(0,o.jsx)("br",{}),"The first relationship in the universe was a brother's.",(0,o.jsx)("br",{}),"One whisper later, it was a wound."]})})]}),(0,o.jsx)("nav",{className:"tabs",children:F0.map(a=>(0,o.jsx)("button",{className:`tab${e===a.id?" active":""}`,onClick:()=>t(a.id),children:a.l},a.id))}),e==="twins"&&(0,o.jsxs)("div",{children:[(0,o.jsx)("div",{className:"sec",children:"The Central Argument"}),(0,o.jsxs)("div",{className:"pull",children:["The whole thing is about a relationship built on trust and belief.",(0,o.jsx)("br",{}),(0,o.jsx)("br",{}),"The oldest one is two brothers. ",(0,o.jsx)("em",{children:"Nepisano. Sano."})," Unwritten and Enlightened. Darkness and Light, frequency collected into being. Everything else in the universe grows out of the way those two treat each other, and out of the day a Davos whispered into one of them that the other didn't love him."]}),(0,o.jsx)("div",{className:"cmp",children:[["Name","Nepisano \xB7 Croatian: Unwritten","Sano \xB7 Croatian: Enlightened"],["Force","The Darkness","The Light \xB7 The Sun (Arcana XIX)"],["Place","The Unwritten; before that, Hell","The Center; the royal palace; the sky"],["Family","Uncle to Hecate; brother-in-law to Gaia","King; husband of Gaia; father of Hecate"],["Gift","The voice of reason; the cool logic that made governance possible","Generosity that makes worlds; the warmth that draws others in"],["Wound","Told he was forgotten, and believed it","Mourning a brother he was too busy to notice leaving"],["Technique","Listens first, then speaks in a borrowed voice","Answers need with something real, at cost"],["What each wants","To be known and not forgotten","His brother back, whole"]].map(([a,l,n])=>(0,o.jsxs)("div",{className:"cmp-row",children:[(0,o.jsx)("div",{className:"cmp-k",children:a}),(0,o.jsx)("div",{className:"cmp-n",children:l}),(0,o.jsx)("div",{className:"cmp-s",children:n})]},a))}),(0,o.jsxs)("div",{className:"dc gold",children:[(0,o.jsx)("div",{className:"dc-lbl",children:"Gemini"}),(0,o.jsx)("div",{className:"dc-t",children:"The Twins Are One Frequency in Two Registers"}),(0,o.jsx)("div",{className:"dc-b",children:"Night and day. The Dzin served as their guard, and the two of them ruled the center together, day and night. When one was overwhelmed, the other steadied him. When one fell, the whole of creation felt it, which is why their fight nearly collapsed the universe and why their reconciliation could bind time itself."})]}),(0,o.jsxs)("div",{className:"dc void",children:[(0,o.jsx)("div",{className:"dc-lbl",children:"How to Read This File"}),(0,o.jsx)("div",{className:"dc-t",children:"Left Is Cold, Right Is Warm"}),(0,o.jsxs)("div",{className:"dc-b",children:["Every tab runs two columns: Nepisano on the left in cold blue, Sano on the right in warm gold. Anything marked ",(0,o.jsx)(qu,{})," is drafted from canon and awaiting your confirmation. The final tab collects the questions that would settle them."]})]})]}),e==="nature"&&(0,o.jsx)(xu,{n:(0,o.jsxs)(o.Fragment,{children:[(0,o.jsxs)(ee,{c:"cold",lbl:"His Name",t:"Nepisano \xB7 The Unwritten \xB7 What He Became",children:["Croatian for ",(0,o.jsx)("em",{children:"Unwritten."})," He is the Darkness, and where there is Darkness there will always be the Light. The name describes what he is: the thing outside the record. The Davos tried to turn it into a verdict."]}),(0,o.jsx)(ee,{c:"void",lbl:"His Nature",t:"Cool, Logical, Patient \xB7 Never Malicious, Never Evil",children:"The voice of reason who talked a screaming assembly into governing instead of fighting. What corrupts him is not his nature but what was done to him. He is not Hell's faction and not one of the Seven Princes. He is a being of immense age and intelligence who was taught a false premise about love and has been operating on it ever since."}),(0,o.jsxs)("div",{className:"dc",children:[(0,o.jsx)("div",{className:"dc-lbl",children:"Gender Frequency"}),(0,o.jsx)("div",{className:"dc-t",children:"Male \xB7 The Arcana\u2019s Specific Quality"}),(0,o.jsxs)("div",{className:"dc-b",children:["The Arcana are primordial forces, but primordial forces put off gender frequencies \u2014 the specific quality of a being\u2019s relationship to the universe expresses as a gendered resonance in the mortal layer\u2019s perception of it. The Darkness\u2019s gender frequency is ",(0,o.jsx)("em",{children:"male."}),(0,o.jsx)("br",{}),(0,o.jsx)("br",{}),"His maleness is the specific frequency of a being who has existed beyond relationship for longer than the mortal layer has had language for loneliness \u2014 and who has decided that the absence of relationship is not a wound but a position. That is a male frequency in this universe: not because men are without relationship, but because the specific decision to make a position of isolation, to make a philosophy of the cage, to protect oneself from warmth by deciding warmth is the prison \u2014 that decision, in its oldest and most absolute form, resonates male.",(0,o.jsx)("br",{}),(0,o.jsx)("br",{}),"He would not accept this characterization. He would say he has no gender. He would be wrong. He puts off the frequency whether he acknowledges it or not. The daughters\u2019 practice reads him as ",(0,o.jsx)("em",{children:"he."})]})]}),(0,o.jsxs)("div",{className:"dc void",children:[(0,o.jsx)("div",{className:"dc-lbl",children:"His Constraint"}),(0,o.jsx)("div",{className:"dc-t",children:"He Cannot Cross the Boundary"}),(0,o.jsxs)("div",{className:"dc-b",children:["While the Veil holds, he cannot enter the mortal layer. This is not a rule someone made. It is the cosmological architecture of what he is: he is the force the boundary holds back. The boundary holding him back is part of his definition. Removing the boundary does not make him something different. It makes him something uncontained.",(0,o.jsx)("br",{}),(0,o.jsx)("br",{}),"This constraint is why the lie is not his preferred technique. ",(0,o.jsx)("strong",{children:"It is his only technique."})," He cannot come to the mortal layer. He can only persuade beings in the mortal layer to step toward him. Every operation he has ever run has been a variation on the same architecture: find someone who wants something they
