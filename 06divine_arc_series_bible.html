const TONE_NOTES = [
    { label: "Book 5 \u2014 The Interior Battlefield (darkest before dawn)", body: "Written in the Stars bends darker through its middle before the birth-light \u2014 the Kansas-storm structure: false certainty of loss, the silent gasp, the stillness, then light breaking open so suddenly it disorients. The dark stretch (roughly the tribunal-to-birth run) is locked to JUNE\u2019S INTERIOR and written from inside her unraveling, because the hardest battles with the worst demons are the ones fought alone inside our own minds. The external siege (the rigged June 25 tribunal, compulsion papers, counterfeit signatures, the corruption spreading like something almost alive) is felt only as pressure on her mind, never narrated from the corridor\u2019s vantage. The corridor\u2019s doubt lands on her as abandonment; the corruption toward Wren is felt moving through her own body. Lela matters because she can reach the one place no one else can \u2014 the interior battlefield. Kokabiel\u2019s light must break IN from outside; he cannot fight a solitary internal war for her, only be the fixed point she finds her way back toward. POV stays locked to June until the climactic surge, the one moment the camera may feel the dawn breaking in from outside her. The name Brian Lee calls it by stays withheld from the reader." }, { label: "Grounded through the cosmic", body: "The arc operates at the Arcana level but is always experienced through specific people in specific places. The cosmic scale is felt through what it does to the Pike County corridor, to Brian Lee's drawings, to the Tuesday special at the diner. The bigger the stakes, the more specific the human detail." },

const CONTINUITY = [
    { name: "Dixie & Azazel", note: "The Pike County compact is the arc's central Older Mechanism anchor. Dixie is the mortal world's primary voice into the Arcana layer. Azazel's knowledge of the pre-formal-framework period becomes critical in The War." },
    { name: "June & Kokabiel", note: "June is the High Priestess's thread. She receives the Prophecy (Book 5) and serves as the arc's primary prophetic voice. Kokabiel's stellar domain edges the Star Arcana — he is the signal carrier to Hecate in the deep places. BOOK 5 CLIMAX (canon): Berith corrupts the Archive so the true thing arrives looking unproven; the compulsion tribunal (June 25, signed by Yahoel) rests on that corrupted record, and the same corruption turns the dragon-dreams to nightmares. The corruption goes so deep June nearly loses herself entirely. The dawn breaks via THREE things at once: (1) a veiled threat to June \u2014 innocent in all of it \u2014 is Kokabiel\u2019s last straw after 70 years of patient watching, and his surge of righteous anger emits a precise frequency; (2) that frequency acts as a SPOTLIGHT, letting the few waking Horde members find the wrongness they could not locate alone, and destroy it \u2014 creation unmaking corruption; (3) the Archive corrects to true because the Archive is the witness this time \u2014 Kokabiel never lost belief or trust in June, even when the corridor did, and his unbroken belief is the incorruptible witness the record needed. The corridor sees the result (the sun after a sudden Kansas storm) but not the mechanism: no one is sure HOW. Kokabiel\u2019s 70 years of watching one star pays off as the capacity to not look away from June." },
    { name: "Lela & Tamiel \u2014 The Sixty-Two Years", note: "A prior pairing pivotal to June. RECONCILED TRAGEDY (both truths hold, and are causally linked): they were the RIGHT PERSON at the WRONG TIME, AND they were punished \u2014 because the wrong time was IMPOSED. Lela Calhoun (built the cottage 1963) and Tamiel (Watcher of seals/constraints) were real and right for each other; their love endured and was always worth it. But Heaven held their bond \u2014 and what such bonds produce (Nephilim, the carrier-partnered structure, the older-mechanism flowering) \u2014 in CONTEMPT, as DEFECTIVE, beneath Heaven\u2019s order. This is Heaven\u2019s superiority complex, the same conviction that drives the audit, the tribunal, and ultimately the corruption and Michael. Out of that contempt Heaven BOUND Tamiel for sixty-two years as punishment for the 1963 partnership. So the \u2018wrong time\u2019 was not accident or fate \u2014 it was imposed by a power that looked at a real love, called it lesser, and used its authority to keep two right people apart. They were forced to miss each other. Lela died in 1988 still apart from him. LELA & TAMIEL ARE THE PERSONAL PRECEDENT of exactly what Heaven is now doing to June & Kokabiel (voiding the bond, neutralizing the witness): June lives in the house of the couple Heaven already did this to \u2014 \u201cthis is what happens to people like us, and it is happening again.\u201d The cottage frees Tamiel (it took Lela\u2019s love to build and hold; it unfastens Heaven\u2019s binding) \u2014 but TOO LATE for Lela: the dawn comes for Tamiel alone, sixty-two years late, and she is not there. That ache stays open through the dark middle. Lela\u2019s eventual sacrifice for June is, in part, her finally getting to give the dawn she herself never received. Lela\u2019s narrative function: she is not a cautionary shadow but a GUIDE. In June\u2019s darkest hour \u2014 inside the near-loss caused by Berith\u2019s corruption \u2014 Lela comes to June in the darkest places of her mind and turns her back toward Kokabiel (the interior counterpart to Kokabiel\u2019s light in the external storm). When Lela touches June she transmits the First Law stated fully: love is not the foundation \u2014 trust and belief are; love is a verb, an action, putting the other on the same frequency you hold yourself in, even when you do not want to. This is the truth that saves June, because chosen trust cannot be corrupted the way feelings can. (See Theology Bible, First Law.) LELA\u2019S FULL ARC across Book 5: PRESENCE (Ch.1) \u2014 Lela built the cottage by hand (1963), died there (1988); thirty-seven years later June & Kokabiel move in. Her love is peaceful RESIDUE soaked into the walls; June (the Dreamer) knows she is there as warmth, not contact; Kokabiel knows her in a different way (recognition of a fellow keeper of the long wait). STORY \u2014 June learns the sixty-two years across the book (Edna Mae and the letters pay it out). CORRUPTION REACHES THE GHOST \u2014 Berith\u2019s corruption grows so deep it broadcasts past death and partially corrupts Lela herself; part of June\u2019s decline IS Lela\u2019s partial corruption (the safe warmth in the walls going wrong from inside). SACRIFICE & CONTACT (climax) \u2014 already being unmade, Lela spends her LAST LIGHT to reverse enough of the corruption in June to turn her back toward Kokabiel\u2019s light; this is the moment of true contact (her touch transmits the verb). She must trust and believe the sacrifice will work, without certainty. SPENT AND FREED \u2014 because the ultimate verb is always rewarded, the sacrifice burns the corruption out of her: the dawn light illuminates her for one moment, she fades with a full radiant smile, then is gone (the where is reserved for later arcs). June KNOWS what Lela did the way Calhoun women just know \u2014 making the victory bittersweet: she lost a presence she relied on but gained something far more real. The house goes quiet in a peaceful way for the first time in thirty-seven years." },
    { name: "The Letter Book \u2014 The Verb in Written Word", note: "June and Kokabiel\u2019s correspondence, kept in a leather binder on facing pages (his letters and her replies), running through the bond and back across his seventy-year watch. It is not a record OF their love \u2014 it IS the love enacted on the page: each letter an act of putting the other on one\u2019s own frequency. The letter book is the verb in written word. This ties to the Penemue / Emily Keldren doctrine (Grigori Bible): the written word HOLDS everything; what is written, holds (Arcadia\u2019s first word in the soil, the Archive, the geological record \u2014 all the same force at different scales). BOOK 5: the letter book is one of the PRIMARY targets of Berith\u2019s corruption \u2014 the most concentrated written-word-as-verb object June possesses. He degrades it so that when June reaches for the letters in her darkest hour, for proof of what she and Kokabiel are, the words arrive WRONG \u2014 hollow, shifted, reading as though the love was never real. The verb-in-written-word turned against her; part of what nearly breaks her (if the written truth can be made false, maybe her whole faculty of witness is corrupted, maybe SHE is the unreliable one). LELA\u2019S COUNTER answers exactly this: the letters can be degraded but the CHOOSING they recorded cannot \u2014 a chosen act that already happened cannot be un-chosen by corrupting its record. The letter book is healed not by restoring the pages but by June re-choosing what they recorded; then it (and the Archive) corrects, because the witness was always true underneath. Kokabiel proves it from outside: his belief never broke \u2014 the verb still performed in real time, unwritable and therefore uncorruptible." },
    { name: "The Dream Journal \u2014 Hope, and the Catalyst of June\u2019s Near-Loss", note: "June\u2019s dream journal is the corridor\u2019s designated SECOND WITNESS to the celestial event (Ch.5): Heaven can neutralize Kokabiel (the primary witness) but supposedly cannot reach the dreaming, which is the Mother\u2019s, not the framework\u2019s. The whole corridor defense rests on this safety net. But where the letter book is the LOVE (its corruption = grief) the dream journal is HOPE \u2014 the witness of what is COMING (the event, the daughter, the dawn). The corruption\u2019s true aim is to SNUFF OUT HOPE: it comes for the dream journal, turning Ch.5\u2019s confident safety net into the failure point of the dark middle (this chapter sets the trap; the dark stretch springs it). This is THE CATALYST that sends June inward, off her months of poised resistance, into the interior battlefield \u2014 because the corruption has reached the one thing she could not armor: her hope for the future. SHE ALMOST GIVES UP. She is nearly lost to the very thing she has resisted all along: despair / severance / the giving-up. She almost JOINS the wrongness (paralleling Wren nearly taken into it \u2014 mother and child both almost claimed, both saved by the same dawn). THE FLOOR BENEATH HOPE (doctrine): hope is a feeling about outcomes and can be corrupted; trust and belief are CHOSEN ACTIONS and cannot. Lela\u2019s truth is the floor beneath hope \u2014 you do not need to feel hopeful to choose to hold; love is a verb; even when you cannot believe in the dawn you can still DO the verb, and the doing is what survives. June is turned back not by restored hope but by restored CHOOSING \u2014 she picks the verb back up when hope is gone, and that choice is what the corruption could not reach and what lets the dawn find her." },
    { name: "The Escalation Ladder \u2014 Why the Corruption Comes (hidden from the corridor)", note: "Heaven\u2019s response to the Pike County corridor escalates in rungs, and Book 5\u2019s darkness is one rung. (1) PROCEDURE \u2014 the audit (Asbeel sent). (2) Asbeel DEFECTS \u2014 freed by June\u2019s witness (Ch.8); the corridor reads it as a clean win (an enforcer became an ally; Iola gets her forty-seven years). (3) But the defection is the TRIGGER: having now lost Saraqiel/Sariel, then Asbeel, atop the whole corridor declaring out in November, Heaven (or the wrongness operating through Heaven\u2019s frustration) escalates from procedure to CORRUPTION \u2014 Berith\u2019s work intensifying behind the visible tribunal/audit. CRITICAL: this causality is HIDDEN from the corridor and stays hidden through Book 5. They cannot see that their victories provoke the deepening dark; every good thing they do feeds the wrongness, and they do not know it. A key engine of the dark middle and of June\u2019s near-loss: you cannot fight a thing when winning makes it worse and you cannot see why. (4) BOOK 6 (seed; develop later): when even the corruption fails \u2014 the dawn breaks, Wren is born clean \u2014 Heaven abandons indirection. It is tired of losing. The corridor\u2019s superpower is that being SEEN TRULY turns Heaven\u2019s own enforcers into allies (Asbeel), so Heaven\u2019s counter is to send the one enforcer it trusts cannot be turned \u2014 the truest believer, belief absolute and unturnable, immune to the corridor\u2019s witness: MICHAEL himself, WITH his sword. No more proxies, no more corruption-by-stealth \u2014 the actual blade. Book 5\u2019s corruption is, in hindsight, everything Heaven tried SHORT of Michael." },
    { name: "Wren \u2014 The Child as the True Dawn", note: "Wren (parents\u2019/star name; Pearlene in the succession line) is in danger the ENTIRE gestation, not only at the birth, because the danger is ontological: corruption can contaminate innocence. By Book 5 Berith\u2019s corruption is so vast it almost seems alive and scheming \u2014 which is near the truth, since corruption taken form is what an Abyssal monster is. It reaches toward Wren on two vectors at once: directly at her forming frequency (to write wrongness into the soul before it binds) and through June (the vessel \u2014 June\u2019s near-loss would take the child into the same wrongness). Nature vs. nurture: no child is born hating; wrongness is written in afterward, and the corruption tries to do that writing early, in the womb. THE TRUE DAWN: Wren is born and does NOT cry. The dawn breaks and she coos, very softly, almost seeming to smile \u2014 the uncorruptible proof that the contamination failed and innocence arrived intact. The corridor feel her frequency arrive clean. Nurture (June\u2019s chosen trust, Kokabiel\u2019s belief, Lela\u2019s verb, the corridor\u2019s love, the dragons unmaking the wrongness) defeats the corruption that tried to be her nature." },
    { name: "Della & Samyaza", note: "Della's herbalist-practitioner knowledge becomes the arc's primary corridor-maintenance intelligence during The Occupancy. Brian Lee's Nephilim-line perceptual ability — already drawing impossible things — begins drawing Arcana-level events in Book 2." },
    { name: "Carla June & Baraqiel", note: "Carla June's warmth-as-resistance is Strength-adjacent — the Arcana notices her. The diner becomes a refuge-point during The Occupancy because her warmth holds something the Darkness cannot easily move through." },

    { name: "Saraqael & Loren Ritcher", note: "The former Hunter's arc through the continuation series positions him as the formal framework's most honest internal voice during the crisis. Loren's gift — transforming the weight of grief — becomes operationally significant in The Repentance." },
    { name: "Uriel", note: "The defected enforcer becomes the arc's most valuable formal-framework intelligence asset. He has seen the Arcana layer once, briefly, and it changed him. He has been trying to articulate what he saw ever since." },
    { name: "Wren", note: "Born under the Star's opening. Her arrival is in the Arcana's record. She is too young to act in this arc — but she is present, and the arc knows she is present, and the final pages of The Restoration include her looking up at the rebuilt Veil and recognizing it." },
    { name: "Mreza \u2014 The Awakened Web", note: "Per The Codex (supreme canon): the Web's remembered name. Mreza means Weaving \u2014 maternal, collective, witnessing relational consciousness emerging from accumulated witness, memory, trust, belief, love, grief, and preserved frequency. She takes conscious form by the END of the Divine Arc, during The Restoration. Recognition sequence: herself, then a child, then June, then Kokabiel, then the Dreamers collectively, then Abaddon, and finally the Abyss. Her first state is disorientation; her greatest temptation is forced harmonization; her victory is choosing relationship over control." },
