@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}

/* \u2500\u2500 The Unwritten Palette \u2500\u2500 */
/* The tension between two brothers: cold void blue and distant warm gold.  */
/* The Darkness and The Sun. Nepisano and Sano. What was lost and what held.*/

.uw{max-width:980px;margin:0 auto;padding:32px 18px 80px;background:#0a0f1c;min-height:100vh;color:#d8e0f0;font-family:'Cormorant Garamond',Georgia,serif;}

/* Header: split between cold and warmth */
.hd{text-align:center;padding:54px 0 40px;border-bottom:1px solid #2a3752;margin-bottom:36px;position:relative;overflow:hidden;}
.hd::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 40% 60% at 20% 50%,rgba(30,58,95,.25) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 80% 50%,rgba(245,158,11,.08) 0%,transparent 70%);pointer-events:none;}
.hd-lbl{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.42em;color:#6f9bd6;text-transform:uppercase;margin-bottom:14px;}
.hd-title{font-family:'Cinzel Decorative',serif;font-size:clamp(22px,5.5vw,48px);font-weight:700;color:#d8e0f0;line-height:1.1;margin-bottom:8px;text-shadow:0 0 80px rgba(30,58,95,.7);}
.hd-sub{font-family:'Cinzel',serif;font-size:clamp(9px,2vw,13px);color:#8fb0e0;letter-spacing:.28em;margin-bottom:18px;}
.split-sub{display:flex;justify-content:center;gap:30px;margin-bottom:18px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;}
.split-cold{color:#6f9bd6;}.split-warm{color:#e0953a;}
.hd-tag{font-style:italic;font-size:14px;color:#8aa0c4;max-width:640px;margin:0 auto;line-height:1.9;}

.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:28px;border-bottom:1px solid #2a3752;padding-bottom:12px;}
.tab{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;padding:6px 12px;border:1px solid #2a3752;background:transparent;color:#8aa0c4;cursor:pointer;transition:all .2s;}
.tab:hover{border-color:#6f9bd6;color:#a8c4ec;}
.tab.active{background:rgba(30,58,95,.22);border-color:#6f9bd6;color:#d8e0f0;}
.sec{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:#6f9bd6;margin:24px 0 14px;padding-bottom:7px;border-bottom:1px solid #2a3752;}
hr{border:none;border-top:1px solid #2a3752;margin:20px 0;}
.orn{text-align:center;font-size:14px;color:#6f86ac;margin:16px 0;letter-spacing:12px;}

/* PULL QUOTES */
.pull{border-left:3px solid #3f6ba8;padding:14px 18px;background:rgba(30,58,95,.07);margin:14px 0;font-size:14px;font-style:italic;line-height:1.88;color:#d8e0f0;}
.pull.warm{border-left-color:#f59e0b;background:rgba(245,158,11,.06);}
.pull.split{border:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
.pull-cold{border-left:3px solid #3f6ba8;padding:14px 18px;background:rgba(30,58,95,.07);font-size:13px;font-style:italic;line-height:1.8;color:#d8e0f0;}
.pull-warm{border-left:3px solid #f59e0b;padding:14px 18px;background:rgba(245,158,11,.06);font-size:13px;font-style:italic;line-height:1.8;color:#fde68a;}

/* DOCTRINE CARDS */
.dc{background:#111a2c;border:1px solid #2a3752;border-left:3px solid #3f6ba8;padding:16px 20px;margin-bottom:11px;}
.dc.warm{border-left-color:#f59e0b;}.dc.void{border-left-color:#6f86ac;background:rgba(40,55,90,.35);}
.dc.cr{border-left-color:#d05a5a;}.dc.gr{border-left-color:#4a8c4a;}.dc.mn{border-left-color:#94a3b8;}
.dc.pu{border-left-color:#8a6fd0;}.dc.gold{border-left-color:#c9943a;}
.dc-lbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.35em;color:#6f86ac;text-transform:uppercase;margin-bottom:5px;}
.dc-t{font-family:'Cinzel',serif;font-size:15px;color:#d8e0f0;margin-bottom:6px;line-height:1.3;}
.dc-b{font-size:13px;line-height:1.78;color:#b4c1dc;}
.dc-b em{color:#d8e0f0;font-style:italic;}
.dc-b strong{color:#a8c4ec;font-weight:600;}
.dc-b strong.warm{color:#fde68a;}
.dc-b strong.cr{color:#f87171;}

/* BROTHERS COMPARISON */
.brothers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
.bro{padding:16px 18px;border:1px solid;font-size:13px;line-height:1.72;}
.bro-cold{background:rgba(30,58,95,.08);border-color:#3f6ba8;}
.bro-warm{background:rgba(245,158,11,.06);border-color:#f59e0b;}
.bro-name{font-family:'Cinzel Decorative',serif;font-size:16px;margin-bottom:4px;}
.bro-sub{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;margin-bottom:10px;opacity:.7;}
.bro-b{font-size:12px;color:#9aabcb;line-height:1.65;}
.bro-b em{font-style:italic;}

/* BOOK CARDS */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px;margin-top:12px;}
.book{background:#111a2c;border:1px solid #2a3752;border-top:3px solid #3f6ba8;padding:14px 16px;}
.book.warm{border-top-color:#f59e0b;}
.book.split{border-top-color:#8a6fd0;}
.bk-n{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.3em;color:#6f9bd6;margin-bottom:4px;}
.bk-t{font-family:'Cinzel',serif;font-size:14px;color:#d8e0f0;margin-bottom:5px;line-height:1.3;}
.bk-arc{font-size:10px;font-style:italic;color:#6f9bd6;margin-bottom:6px;}
.bk-b{font-size:12px;line-height:1.62;color:#b4c1dc;}
.bk-b em{color:#d8e0f0;font-style:italic;}
.bk-q{margin-top:8px;padding-top:7px;border-top:1px solid #2a3752;font-size:11px;font-style:italic;color:#3f6ba8;}

/* TIMELINE */
.tl-row{display:grid;grid-template-columns:110px 14px 1fr;gap:0 14px;margin-bottom:8px;align-items:start;}
.tl-date{text-align:right;padding-top:12px;font-family:'Cinzel',serif;font-size:10px;color:#6f9bd6;line-height:1.3;}
.tl-spine{display:flex;flex-direction:column;align-items:center;padding-top:11px;}
.tl-dot{width:11px;height:11px;border-radius:50%;border:2px solid #3f6ba8;flex-shrink:0;}
.tl-dot.key{width:14px;height:14px;background:#3f6ba8;}
.tl-dot.warm{border-color:#f59e0b;}.tl-dot.warm.key{background:#f59e0b;}
.tl-line{width:2px;flex:1;min-height:8px;margin-top:2px;background:#3f6ba8;opacity:.2;}
.tl-card{background:#111a2c;border:1px solid #2a3752;border-left:3px solid #3f6ba8;padding:12px 16px;margin-bottom:4px;}
.tl-card.warm{border-left-color:#f59e0b;}
.tl-title{font-family:'Cinzel',serif;font-size:13px;color:#d8e0f0;margin-bottom:4px;}
.tl-b{font-size:12px;line-height:1.62;color:#b4c1dc;}
.tl-b em{color:#d8e0f0;}
`,ky=[{id:"premise",l:"The Premise"},{id:"creation",l:"The Creation"},{id:"brothers",l:"Nepisano \xB7 Sano"},{id:"hell",l:"Hell \xB7 Heaven \xB7 The Kingdom"},{id:"books",l:"The Books"},{id:"canon",l:"Canon \xB7 Continuity"}],Fy=[{n:"Book 1",t:"The Twins",arc:"The Lovers \xB7 The Sun",warm:!1,b:`Light and Darkness before time had meaning: <em>frequency collected into being.</em> Nepisano is the Darkness; Sano, his Gemini twin, is the Light, always full of energy and drawing others to him. Sano finds Gaia crying; she has no place to plant her seed of life. He pulls the space dust together so hard it makes a bang and the dust splits into ten distinct spheres with an eleventh enclosing everything, including them. The assembly wakes shouting: Arcana, Voljeti, Davos, Bone Mother, Sjena, Nasilin, Dzin, Susti. Sano is overwhelmed. Nepisano steps in and calms the crowd with one question: <em>why not govern instead of fight?</em>

The territories are agreed and the seed planted in every sphere. Everything works, for a long time, except Pluto, where the seed did not take right and the Davos feel tricked.`,q:"Nepisano was the voice of reason that made creation possible. What did that feel like from the inside, and who thanked him?"},{n:"Book 2",t:"The Choosing",arc:"The Empress \xB7 The Lovers",warm:!0,b:`Sano is a happy man who still wants something. Gaia's face keeps coming back to him. He woos her; she is not expecting it, and she says yes. <em>The first choosing. The first relationship built on trust and belief.</em> Hecate is born: the Moon, a perfect reflection of her father with her mother's beauty. Sano is named King, Gaia Queen, and all creation celebrates. Even Nepisano.

Hecate is never afraid of him and keeps night-owl hours, which gives him someone to talk to while his brother is busy. Then she grows, and her interest drifts toward her mother's Creation. In the quiet, Andras, the most ruthless of the Davos, finds Nepisano watching from a distance.`,q:"Hecate was the one person who was never afraid of him. What did Nepisano lose when she grew out of their nights?"},{n:"Book 3",t:"The Whisper",arc:"The Devil \xB7 The Tower",warm:!1,b:`Andras whispers the first lie: <em>They don't love you. Your brother used you. Love is not real. Eventually everyone forgets you.</em> Not a shout. A seed, fed slowly. Nepisano was always cool, never malicious, never evil; now the night grows cold and dangerous, and the change screams across the frequency of creation. The corruption makes him insane until the day he attacks Gaia for "taking his brother away."

Hecate sees her mother running from her uncle through the Garden. Her frequency matches her father's so strongly that a flash hits Nepisano in the eyes and reaches his core, destroying the corruption. The damage is felt just the same. He flees into the deep places of the Garden and says <em>Out. I want out of here.</em> A doorway opens, and the realm builds itself around his wounded mind: his Hell, with the balance of it, his Heaven. When his mind heals, he feels rage for the first time. Cold, not hot.`,q:"The flash destroyed the corruption but not the wound. What did Nepisano keep from the lie after it was gone?"},{n:"Book 4",t:"The Binding",arc:"Judgement \xB7 The Wheel of Fortune",warm:!0,b:`Nepisano returns to the Garden surface to find the Dzin waiting. He demands his brother. Sano is already there, blazing with fury. They fight, and creation was never meant to handle the two of them fighting. As it collapses around them they reconcile, and that restored bond lets the Bone Mother, Keeper of the Archive and keeper of Time itself, cast a binding spell on time.

There is a catch: seven tries to get it right, and only she knows. She watches six cycles, each going further than the last, each ending when the Davos, more aggressive and more numerous every time, sow the seed of corruption again. This is the last cycle.`,q:"What did the brothers say to each other as the world came down? Did either of them say it in words?"},{n:"Book 5",t:"The Seventh Cycle",arc:"The Magician \xB7 The Strength \xB7 The Star",warm:!1,b:`Something new. Hecate takes a life seed without asking and presses it into clay shaped like the primordial beast Agron, and the clay opens its eyes, stands, and smiles. She names him Leviathan, her best friend. Gaia is not angry; she is thrilled. Humans follow, seven pairs, each sent to a Susti to learn to survive rather than serve.

Then the Davos whisper to Satan, a red dragon sulking because Hecate is playing with Leviathan instead of him. At the festival at Babel, Cain kills Abel; Sano sends the Dzin, who mark Cain with three slashes. Arcadia refuses Satan flat. Cain, turned by Satan's glance, stabs her in the Familiar Bond ritual after she writes the first word, HERE. Leviathan's roar drives Cain so deep he finds the side door into Hell, where Nepisano offers a job and a name: <em>Never lose yourself, Lucifer, Prince of Pride and first regent of Hell.</em> Then he leaves. Abaddon invokes the Strength Arcana, slays Satan at the cost of everything, and dies; Leviathan and the Seven Wardens cage the dragon's spell inside the Horde, and the flood follows. Sano finds Abaddon dying and makes his deal.`,q:"Nepisano said he needed a break and time to think. What was he actually running from, and from whom?"},{n:"Book 6",t:"The Commission",arc:"The Hermit \xB7 The Hanged Man \xB7 The World",warm:!1,b:`Sano walls the Mortal Layer off from the rips: the Corridor as its doorway, the Web as the world's recorded memory, bound to Gaia's World Tree. Lucifer carves out his regency with six brothers; the second sealing of Satan on the streets of Hell. In 1414 the locks fail, Vine proposes the Church and persecution as a power source, and the Order of Shadows opens the Dark Ages. Hecate walks the wall at night, missing her uncle.

The Voljeti propose the Great Commission; the Grigori volunteer, and the Corridor's dissonance rips Azazel's wings away. Heaven and Hell find the doors, the three factions brawl, and humans decide monsters are real. The war that follows leads straight to Book One: Fallin' for a Fallen.`,q:"Abaddon was told to bring Nepisano back whole, but not before then. Who decides when he is whole, and what does he need to hear when he gets there?"}],s0=[{key:!0,warm:!1,date:"Before Time",title:"Light and Darkness \xB7 Sano and Nepisano",body:"Frequency collected into being. Nepisano is the Darkness who resides in the Unwritten; Sano is the Light, his Gemini twin and beloved brother."},{key:!0,warm:!0,date:"The Bang",title:"Gaia's Seed \xB7 Ten Spheres and an Eleventh",body:"Gaia has no place to plant her seed. Sano pulls the space dust together until it bangs: ten distinct spheres, and a huge eleventh enclosing everything and everyone, even Nepisano."},{key:!1,warm:!1,date:"The Assembly",title:"Nepisano Calms the Crowd \xB7 The Territories",body:"Arcana, Voljeti, Davos, Bone Mother, Sjena, Nasilin, Dzin and Susti demand answers. Nepisano asks why not govern instead of fight. Dzin take Mercury, Arcana Venus, Gaia and the Susti Earth, Sjena Mars, Voljeti Jupiter and Saturn, Nasilin Uranus, the Bone Mother Neptune, and the Davos small, dark, frozen Pluto."},{key:!0,warm:!0,date:"The First Choosing",title:"Sano Woos Gaia \xB7 Hecate Is Born",body:"The first romance and the first relationship built on trust and belief. Hecate, the Moon, is born; Sano is named King and Gaia Queen. Nepisano celebrates and finds a night-owl niece who is never afraid of him."},{key:!0,warm:!1,date:"The Whisper",title:"Andras and the First Lie",body:"The Davos leader finds Nepisano watching from a distance: they don't love you, your brother used you, everyone forgets you. The seed of corruption takes."},{key:!0,warm:!0,date:"The Flash",title:"Hecate Intervenes \xB7 Hell and Heaven Are Born",body:`Nepisano attacks Gaia; Hecate's light destroys the corruption but not the wound. He flees, says "Out. I want out of here," and Hell builds itself around his mind, with Heaven as its balance.`},{key:!1,warm:!0,date:"The Binding Spell",title:"The Brothers Reconcile \xB7 Six Cycles Fail",body:"Creation collapses around their fight and the bond restored between them lets the Bone Mother cast a binding spell on time. Seven tries. Six cycles are lost to the Davos."},{key:!0,warm:!1,date:"The Seventh Cycle",title:"Leviathan \xB7 Babel \xB7 Cain \xB7 Arcadia \xB7 Abaddon",body:"Life from clay. Satan turned by the Davos. Cain kills Abel, is marked, becomes Lucifer. Arcadia dies. Abaddon invokes Strength, slays Satan and dies; the Seven Wardens and Leviathan cage the dragon in the Horde and the flood follows. Sano makes Abaddon his deal."},{key:!1,warm:!0,date:"The Wall",title:"The Corridor and the Web",body:"Sano walls the Mortal Layer in the energy of Arcadia's and Abaddon's deaths, unaware of the two parallel worlds beneath. The Corridor is its doorway; the Web is the world's recorded memory, bound to Gaia's World Tree."},{key:!1,warm:!1,date:"1414",title:"The Second Sealing \xB7 Vine \xB7 The Order of Shadows",body:"Satan sealed again on the streets of Hell; Lucifer is made his warden. The locks fail in 1414. Vine's plan funnels practitioner frequency through the Church; the Dark Ages begin."},{key:!0,warm:!0,date:"The Commission",title:"Grigori \xB7 The Fall \xB7 The Brawl",body:"The Voljeti's Great Commission sends the Grigori through a Corridor 2,000 years old; Azazel's wings are ripped off. The three factions meet in a brawl, and a war of ten thousand years follows, up to Book One."}];function qo(){let[t,l]=(0,d0.useState)("premise"),e=a=>(0,m.jsxs)("div",{className:`dc ${a.c}`,style:{marginBottom:11},children:[(0,m.jsx)("div",{className:"dc-lbl",children:a.t}),(0,m.jsx)("div",{className:"dc-t",style:{color:a.c==="warm"||a.c==="gold"?"#fde68a":a.c==="cr"?"#f87171":"#d8e0f0"} elief. The first lie, Andras to Nepisano, was the first attack on it."})]}),(0,m.jsxs)("div",{className:"brothers",children:[(0,m.jsxs)("div",{className:"bro bro-cold",children:[(0,m.jsx)("div",{className:"bro-name",style:{color:"#8fb4ee"},children:"Nepisano"}),(0,m.jsx)("div",{className:"bro-sub",style:{color:"#6f9bd6"},children:"Croatian: Unwritten \xB7 The Darkness \xB7 King of Hell"}),(0,m.jsxs)("div",{className:"bro-b",children:["The cool twin. The voice of reason who talked a screaming assembly into governing instead of fighting. Cool, never malicious, never evil, until the Davos taught him that love is not real. The corruption was burned out of him by his niece's light, but the wound stayed, and the realm he built around it is a mirror of that wound. The universe has not decided he is lost. He is to be brought back ",(0,m.jsx)("em",{children:"whole"}),"."]})]}),(0,m.jsxs)("div",{className:"bro bro-warm",children:[(0,m.jsx)("div",{className:"bro-name",style:{color:"#f59e0b"},children:"Sano"}),(0,m.jsx)("div",{className:"bro-sub",style:{color:"#e0953a"},children:"Croatian: Enlightened \xB7 The Sun \xB7 Hecate's Father"}),(0,m.jsxs)("div",{className:"bro-b",children:["The warm twin. The one who answered a crying stranger by making a universe. King, husband of Gaia, father of Hecate. He was busy, and busy is not the same as cruel, but the Prequel asks whether it was close enough to feel like it. When Nepisano fought him, he fought back; when it was over, he reconciled. He sends a dying mortal after his brother with one instruction: ",(0,m.jsx)("em",{children:"not before he is whole."})]})]})]}),(0,m.jsxs)("div",{className:"dc cold",children:[(0,m.jsx)("div",{className:"dc-lbl",children:"The Wound"}),(0,m.jsx)("div",{className:"dc-t",children:"The Forgotten Brother Who Was Told He Was"}),(0,m.jsx)("div",{className:"dc-b",children:"The earlier framing of this arc was a brother who thinks he was rejected. The creation story sharpens it: he was told. Andras found him watching from a distance, in the one moment he was alone, and said the sentence he was already afraid of. A lie lands hardest where there is a true thing next to it. Sano was busy. Hecate did grow up. The Prequel is about the gap between what happened and what he was told it meant."})]}),(0,m.jsxs)("div",{className:"dc warm",children:[(0,m.jsx)("div",{className:"dc-lbl",children:"The Arc's Position in the Universe"}),(0,m.jsx)("div",{className:"dc-t",children:"After the Divine Arc \xB7 A Prequel in Sequence"}),(0,m.jsx)("div",{className:"dc-b",children:"The Unwritten precedes the main series by tens of thousands of years but publishes after the Divine Arc, after the Restoration, after Hecate goes home to Gaia and Sano.\\n\\nThe reader already knows how Nepisano's story ends. The weight of that knowledge is the medium. Each book hands the reader a moment where one honest sentence would have changed everything, and nobody says it."})]})]}),t==="creation"&&(0,m.jsxs)("div",{children:[(0,m.jsx)("div",{className:"sec",children:"The Creation \xB7 Eleven Spheres"}),(0,m.jsxs)("div",{className:"pull split",children:[(0,m.jsx)("div",{className:"pull-cold",children:"Ten distinct spheres, and a huge eleventh encompassing everything and everyone. Shock was the first thing all felt. First nothing was said. Then many voices."}),(0,m.jsx)("div",{className:"pull-warm",children:"Sano, genuinely touched, crafted the only thing he could."})]}),(0,m.jsx)("div",{className:"sec",children:"The Assembly"}),[{c:"cold",t:"Arcana",ti:"22 Primordial Forces \xB7 Venus",b:"The Arcana took the next territory for home and could never be contained."},{c:"cold",t:"Voljeti",ti:"The 12 Keys \xB7 The Older Mechanism \xB7 Jupiter and Saturn",b:"Two territories: Jupiter as an outpost to guard Gaia, as Sano asked, and Saturn as their homestead. Later the authors of the Great Commission."},{c:"cr",t:"Davos",ti:"The 12 Bars \xB7 The Abyss Monsters \xB7 Pluto",b:"The original corrupted. Pure power was their hierarchy. They could not stand Sano's Light but responded to Nepisano's cool logic. Pluto was small, dark and frozen, the seed did not take right, and they felt tricked. Led by Andras."},{c:"mn",t:"Bone Mother",ti:"Keeper of the Archive \xB7 Master Gate Keeper \xB7 Neptune",b:"The only silent one at the assembly. Memory of all creation and so the keeper of Time itself."},{c:"cold",t:"Sjena",ti:"22 Changeling Beasts \xB7 Mars",b:"They took Mars and the hunt began."},{c:"cold",t:"Nasilin",ti:"The 12 Gates \xB7 Primordial Beasts \xB7 Uranus",b:"Served no one but the Bone Mother."},{c:"warm",t:"Dzin",ti:"The 7 Meta-Titans \xB7 Pure Energy \xB7 Mercury",b:"Force made flesh. Guard to Sano and Nepisano, who ruled from the center, day and night."},{c:"warm",t:"Susti",ti:"The 7 Untouched \xB7 Gaia's Handmaidens \xB7 Earth",b:"Maintain Gaia's Garden for her, and later train each human pair to survive rather than serve."}].map(e),(0,m.jsxs)("div",{className:"dc gold",children:[(0,m.jsx)("div",{className:"dc-lbl",children:"Gaia"}),(0,m.jsx)("div",{className:"dc-t",style:{color:"#fde68a"},children:"The Seed of Life \xB7 The Garden \xB7 Earth"}),(0,m.jsx)("div",{className:"dc-b",children:"Crying because she had nowhere to plant her seed. Shocked that Sano could hear her at all."})]}),(0,m.jsx)("hr",{}),(0,m.jsx)("div",{className:"sec",children:"From the Origin to Book One"}),s0.map((a,n)=>(0,m.jsxs)("div",{className:"tl-row",children:[(0,m.jsx)("div",{className:"tl-date",children:a.date}),(0,m.jsxs)("div",{className:"tl-spine",children:[(0,m.jsx)("div",{className:`tl-dot${a.key?" key":""}${a.warm?" warm":""}`}),n<s0.length-1&&(0,m.jsx)("div",{className:"tl-line"})]}),(0,m.jsxs)("div",{className:`tl-card${a.warm?" warm":""}`,children:[(0,m.jsx)("div",{className:"tl-title",children:a.title}),(0,m.jsx)("div",{className:"tl-b",children:a.body})]})]},a.title))]}),t==="brothers"&&(0,m.jsxs)("div",{children:[(0,m.jsx)("div",{className:"sec",children:"Nepisano \xB7 Character Bible"}),[{c:"cold",t:"His Name",ti:"Nepisano \xB7 Unwritten",b:"Croatian for Unwritten. He is the Darkness, and where there is Darkness there will always be the Light. The name is a fact of what he is, not a verdict on what he is worth. The Davos tried to turn it into one."},{c:"cold",t:"His Gift",ti:"The Voice of Reason",b:"At the assembly he saw the attack on his brother, stepped in, and calmed everyone with a question. It was his idea to plant Gaia's seed in every sphere. He is the reason the universe has governance. Remember this before judging what comes after."},{c:"cr",t:"What Was Done to Him",ti:"Andras \xB7 The Whisper",b:"Not a loud voice, not a shout. A seed of doubt, then fed. The corruption made him insane slowly, until he attacked Gaia for taking his brother away. When Hecate's flash destroyed the corruption, he felt the damage just the same. It would take thousands of years, and the most infuriating woman in human existence, to bring him back to his own."},{c:"void",t:"What He Built",ti:"Hell, by Accident \xB7 Heaven, by Balance",b:`He said "Out. I want out of here," and the realm built itself around him, a reflection of his mind at that moment: cold, desolate, rusted, degrading. Heaven is its parallel, the same mind seen the other way: moral bigotry and self-righteousness, <em>I'm more important than you because I believe this.</em> Each cycle he stayed longer and they became more solid instead of fading.`},{c:"cold",t:"His Departure",ti:'"I Need a Break and Time to Think"',b:"He gives Cain a name and a rule, names him regent, mentions that Satan is here, and is gone. Lucifer is left completely stunned. He has not been seen since."}].map(e),(0,m.jsx)("hr",{}),(0,m.jsx)("div",{className:"sec",children:"Sano \xB7 Character Bible"}),[{c:"warm",t:"His Name",ti:"Sano \xB7 Enlightened",b:"Croatian for Enlightened. Always full of energy and attracting others to him. When he met a stranger crying, he did not ask who she was. He asked what was wrong."},{c:"warm",t:"His Family",ti:"King \xB7 Husband of Gaia \xB7 Father of Hecate",b:"The first romance and the first choosing. Named King with Gaia as his Queen. Hecate is a perfect reflection of her father with her mother's beauty. When she takes post on the wall, stubborn, he lets her."},{c:"warm",t:"What He Does",ti:"The Deal \xB7 The Wall",b:"He finds Abaddon dying on the Arcana Layer frequency, the first human ever to cross, and offers to adopt his twins as daughters of Gaia in exchange for finding Nepisano and bringing him back whole, but not before then. He walls the Mortal Layer with the energy of two deaths, <em>unknowing about the two parallel worlds created by his brother's insanity.</em>"},{c:"gold",t:"The Question",ti:"Did He Fail His Twin?",b:"Sano was busy. The Prequel has to decide whether there was a moment when he could have turned toward the edge of the room and did not. Not rejection. Just absence, in the exact place the lie was waiting."}].map(e)]}),t==="hell"&&(0,m.jsxs)("div",{children:[(0,m.jsx)("div",{className:"sec",children:"Hell \xB7 Heaven \xB7 The Formal Framework"}),(0,m.jsxs)("div",{className:"pull",children:["Hell is not fire and punishment. It is the cold.",(0,m.jsx)("br",{}),(0,m.jsx)("br",{}),(0,m.jsx)("em",{children:"It built itself around a wounded mind and has stayed because the mind that made it stayed. Heaven is the same mind from the other side."})]}),[{c:"cold",t:"Hell's Nature",ti:"Cold, Desolate, Isolated, Rusted, Degrading",b:"A version of the Garden that changes as the Garden changes, only rusted. Cold, frozen in places, full of souls from every corner of the universe because the Bone Mother's Gates have been closed since the cycle began, the longest one yet."},{c:"mn",t:"Heaven's Nature",ti:"The Mirror \xB7 Moral Bigotry",b:"The more morally self-righteous you are, the stronger you are. Morally questionable souls are the lesser citizens. The Formal Framework governs both worlds through the lens of a creator force's insanity."},{c:"cr",t:"The Doors",ti:"Souls Without Another Place to Go",b:"They wander the darkness and end up in the Abyss, or find the door Nepisano's energy made. The door opens by personal frequency: the morally self-righteous land in Heaven, the morally inept in Hell. Most in Hell forget they were human within days: the Ferals. The strong keep a self: Feral Pack Leaders, then lesser demons, then Dukes, then the Seven Princes."},{c:"void",t:"The Regents",ti:"Lucifer and Six Brothers",b:"Cain was alive when he arrived, held onto his humanity and his Pride, and refused sanctuary, colorfully. He accepted the job. Lucifer personally chose six of the most powerful and intact souls Hell could not break. All but one: Satan, the former red dragon, Prince of Wrath, whom Lucifer named instead of locking away."},{c:"mn",t:"Abaddon's Place",ti:"The Slayer \xB7 The Deal \xB7 The One Hell Could Not Take",b:"Husband of Arcadia, father of twins Lyrica and Celeste. He invoked Strength, slew Satan, and died. Resonating on the Arcana Layer frequency, nothing in Hell got in his way. When he confronted Satan on the streets of Hell, he sealed him in a box of light tuned to solid and began to compact it until Lucifer said <em>He's my responsibility.</em> Then: keep him contained until he is whole, or he expires. If you don't, I will."},{c:"cr",t:"Satan",ti:"Wrath \xB7 The Dragon \xB7 The Second Sealing",b:"Sealed first inside the Horde, caged by the Seven Wardens and Leviathan. Sealed a second time on the streets of Hell, with Lucifer as his warden. By 1414 the locks were failing, which is why Vine's plan was ever heard."}].map(e)]}),t==="books"&&(0,m.jsxs)("div",{children:[(0,m.jsx)("div",{className:"sec",children:"The Six Books"}),(0,m.jsxs)("div",{className:"pull",children:["Six books, from the first spheres to the threshold of Book One: Fallin' for a Fallen.",(0,m.jsx)("br",{}),(0,m.jsx)("br",{}),(0,m.jsx)("em",{children:"The reader knows how the story ends. Every book is a place where one honest sent
