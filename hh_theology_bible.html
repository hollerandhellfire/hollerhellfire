@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}

/* \u2500\u2500 Theology Bible Palette \xB7 Lighter Purple \u2500\u2500 */
/* The document that holds all of it.            */
/* Deep aubergine ground. Light amethyst accent. */
/* Readable lavender body. The series gold.      */

.tb{max-width:980px;margin:0 auto;padding:32px 18px 80px;background:#120c24;min-height:100vh;color:#f3eeff;font-family:'Cormorant Garamond',Georgia,serif;}
.hd{text-align:center;padding:54px 0 40px;border-bottom:1px solid #33285c;margin-bottom:36px;position:relative;}
.hd::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 0%,rgba(167,139,250,.16) 0%,transparent 70%),radial-gradient(ellipse 30% 25% at 20% 30%,rgba(212,165,90,.06) 0%,transparent 60%),radial-gradient(ellipse 30% 25% at 80% 30%,rgba(45,212,191,.05) 0%,transparent 60%);pointer-events:none;}
.hd-lbl{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.45em;color:#b9a3f5;text-transform:uppercase;margin-bottom:14px;}
.hd-title{font-family:'Cinzel Decorative',serif;font-size:clamp(22px,5.5vw,46px);font-weight:700;color:#f3eeff;line-height:1.1;margin-bottom:8px;text-shadow:0 0 60px rgba(167,139,250,.5),0 0 120px rgba(212,165,90,.14);}
.hd-sub{font-family:'Cinzel',serif;font-size:clamp(9px,2vw,13px);color:#cdbcf7;letter-spacing:.25em;margin-bottom:20px;}
.hd-tag{font-style:italic;font-size:14px;color:#a394cf;max-width:620px;margin:0 auto;line-height:1.85;}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:28px;border-bottom:1px solid #33285c;padding-bottom:12px;}
.tab{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:6px 12px;border:1px solid #3a2f64;background:transparent;color:#9684c4;cursor:pointer;transition:all .2s;}
.tab:hover{border-color:#a78bfa;color:#cdbcf7;}
.tab.active{background:rgba(167,139,250,.22);border-color:#a78bfa;color:#f3eeff;}
.sec{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:#bca4f7;margin:24px 0 14px;padding-bottom:7px;border-bottom:1px solid #33285c;}
.pull{border-left:3px solid #a78bfa;padding:14px 18px;background:rgba(167,139,250,.1);margin:14px 0;font-size:14px;font-style:italic;line-height:1.85;color:#f3eeff;}
.pull.g{border-left-color:#d4a55a;background:rgba(212,165,90,.08);}
.pull.tl{border-left-color:#2dd4bf;background:rgba(45,212,191,.07);}
.pull.cr{border-left-color:#dc7070;background:rgba(220,112,112,.07);}
.pull.mn{border-left-color:#aab6c8;background:rgba(170,182,200,.06);}
.pull.gr{border-left-color:#6cbf6c;background:rgba(108,191,108,.06);}
hr{border:none;border-top:1px solid #33285c;margin:20px 0;}
.orn{text-align:center;font-size:14px;color:#5a4a8a;margin:18px 0;letter-spacing:12px;}

/* DOCTRINE CARDS */
.dc{background:#1b1438;border:1px solid #33285c;border-left:3px solid #a78bfa;padding:16px 20px;margin-bottom:11px;}
.dc.g{border-left-color:#d4a55a;}.dc.tl{border-left-color:#2dd4bf;}.dc.cr{border-left-color:#dc7070;}
.dc.sl{border-left-color:#8493a8;}.dc.gr{border-left-color:#6cbf6c;}.dc.mn{border-left-color:#aab6c8;}
.dc.em{border-left-color:#f3eeff;background:rgba(243,238,255,.04);}
.dc-lbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.35em;color:#8472b0;text-transform:uppercase;margin-bottom:5px;}
.dc-t{font-family:'Cinzel',serif;font-size:15px;color:#f3eeff;margin-bottom:6px;}
.dc-t.pu{color:#cdbcf7;}.dc-t.g{color:#e6c47e;}.dc-t.tl{color:#5eead4;}.dc-t.cr{color:#f49a9a;}.dc-t.mn{color:#d3dbe6;}.dc-t.gr{color:#9ee89e;}
.dc-b{font-size:13.5px;line-height:1.8;color:#d2c6ec;}
.dc-b em{color:#fbf7ff;font-style:italic;}
.dc-b strong{color:#c9b6f5;font-weight:600;}
.dc-b strong.g{color:#e6c47e;}
.dc-b strong.tl{color:#5eead4;}
.dc-b strong.cr{color:#f49a9a;}
.dc-b strong.gr{color:#9ee89e;}
.dc-b strong.mn{color:#d3dbe6;}

/* STACK DIAGRAM */
.stack{display:flex;flex-direction:column;align-items:center;gap:0;margin:18px 0;}
.sl{width:100%;max-width:600px;padding:11px 20px;text-align:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;border:1px solid;}
.sl-arr{font-size:13px;line-height:1;padding:3px 0;width:100%;max-width:600px;text-align:center;}
.sl-note{font-family:'Cormorant Garamond',serif;font-size:10.5px;font-style:italic;margin-top:4px;letter-spacing:.04em;opacity:.85;}
.sl.unw{background:rgba(30,41,59,.6);border-color:#48566e;color:#9fb0c4;}
.sl.aby{background:rgba(20,18,40,.7);border-color:#3a3560;color:#9b93c4;}
.sl.veil{background:rgba(170,182,200,.12);border-color:#8a9ab2;color:#cdd6e4;}
.sl.vl{background:rgba(170,182,200,.1);border-color:#6a7a92;color:#b8c4d6;}
.sl.arc{background:rgba(167,139,250,.2);border-color:#a78bfa;color:#d6c8f8;}
.sl.old{background:rgba(212,165,90,.14);border-color:#d4a55a;color:#ecd09a;}
.sl.gri{background:rgba(99,135,189,.16);border-color:#6387bd;color:#aac4ee;}
.sl.dau{background:rgba(108,191,108,.14);border-color:#6cbf6c;color:#aee8ae;}
.sl.mor{background:rgba(243,238,255,.05);border-color:#4a3d75;color:#b3a3d8;}
.sl.cor{background:rgba(212,165,90,.08);border-color:#a07a3a;color:#d8b87a;}
.sl.bm{background:rgba(220,214,200,.08);border-color:#9a9282;color:#cfc8b8;}
/* opposing bottom layer \u2014 Formal Framework vs Hell on one plane */
.sl-split{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:0;width:100%;max-width:600px;}
.sl-half{padding:11px 16px;text-align:center;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.16em;border:1px solid;}
.sl-half.fw{background:rgba(99,135,189,.14);border-color:#5a7bb5;color:#a8c0e6;}
.sl-half.hl{background:rgba(220,112,112,.13);border-color:#b85a5a;color:#f0a0a0;}
.sl-vs{display:flex;align-items:center;justify-content:center;padding:0 10px;font-family:'Cinzel',serif;font-size:11px;color:#7a6a9a;letter-spacing:.1em;border-top:1px solid #3a2f64;border-bottom:1px solid #3a2f64;}

/* FACTION THEOLOGY GRID */
.fac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px;margin-top:12px;}
.fac{background:#1b1438;border:1px solid #33285c;border-top:3px solid;padding:14px 16px;transition:all .2s;}
.fac:hover{border-color:#a78bfa;box-shadow:0 0 16px rgba(167,139,250,.14);}
.fac-name{font-family:'Cinzel',serif;font-size:14px;color:#f3eeff;margin-bottom:3px;}
.fac-pos{font-size:10.5px;font-style:italic;margin-bottom:7px;letter-spacing:.04em;}
.fac-b{font-size:12.5px;line-height:1.66;color:#cdc0e8;}
.fac-b em{color:#fbf7ff;font-style:italic;}
.fac-b strong{font-weight:600;color:#c9b6f5;}
.fac-err{margin-top:8px;padding-top:7px;border-top:1px solid #33285c;font-size:11px;color:#f08a8a;font-style:italic;}
.fac-cor{margin-top:5px;font-size:11px;color:#8ad48a;font-style:italic;}

/* GIFT TABLE */
.gift-row{display:grid;grid-template-columns:180px 1fr;background:#1b1438;border:1px solid #33285c;margin-bottom:5px;overflow:hidden;}
.gift-row:hover{border-color:#6a5a9a;}
.gr-name{padding:9px 14px;border-right:1px solid #33285c;font-family:'Cinzel',serif;font-size:11px;color:#f3eeff;display:flex;align-items:flex-start;line-height:1.4;}
.gr-body{padding:9px 14px;font-size:11.5px;color:#cdc0e8;line-height:1.6;}
.gr-body em{color:#fbf7ff;font-style:italic;}

/* SOLSTICE CYCLE */
.cycle{display:flex;flex-direction:column;align-items:center;gap:0;margin:16px 0;}
.cy-node{width:100%;max-width:520px;padding:12px 18px;border:1px solid;text-align:center;}
.cy-arr{width:2px;height:28px;margin:0 auto;opacity:.5;}
.cy-lbl{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.22em;margin-bottom:4px;}

ng in the Calhoun line. The practitioner chose the frequency. The Arcana recognized the match. The Sun (Sano) and the Moon (Hecate) both belong to this layer."]})]}),(0,c.jsxs)("div",{className:"dc g",children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Layer Five"}),(0,c.jsx)("div",{className:"dc-t g",children:"The Older Mechanism \xB7 Bond Law \xB7 Compact Law"}),(0,c.jsx)("div",{className:"dc-b",children:"The foundational law that predates the formal framework, the Church\u2019s institutional architecture, and every compact the Princes negotiated. Bond law. Compact law. Web authority. It was encoded under the Arcana layer\u2019s authority before the formal framework existed to claim jurisdiction over it.\\n\\nThe Older Mechanism\u2019s record cannot be falsified. Berith (Duke of Hell, alchemy and lies) specifically targets its frequency to make truth look false, but the record holds. Raziel in Heaven\u2019s foundational archive maintains a copy. The daughters\u2019 practice carries it in living form. It is the document every faction has been fighting over the authority to interpret \u2014 while the document itself exists prior to all of them."})]}),(0,c.jsxs)("div",{className:"dc sl",children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Layer Six"}),(0,c.jsx)("div",{className:"dc-t mn",children:"The Grigori \xB7 200 Watchers"}),(0,c.jsx)("div",{className:"dc-b",children:"Commissioned through the Lovers Arcana to accompany the daughters\u2019 practice \u2014 not enforce it, not contain it, not govern it. Accompany it. The Grigori\u2019s commission was always relationship. The formal framework reframed it as surveillance. The H&H series is the correction: book by book, bond by bond, the Grigori return to their original function."})]}),(0,c.jsxs)("div",{className:"dc gr",children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Layer Seven"}),(0,c.jsx)("div",{className:"dc-t gr",children:"The Daughters\u2019 Practice \xB7 The Web \xB7 30,000 Years"}),(0,c.jsxs)(" en"}),(0,c.jsx)("div",{className:"dc-t mn",children:"The Bone Mother\u2019s Realm"}),(0,c.jsxs)("div",{className:"dc-b",children:["Where the dead are received. The Bone Mother keeps some souls and releases others. The souls she refuses \u2014 and the souls brought to her unready, before their time, without the weight of a completed life \u2014 have nowhere to go but the cold below. ",(0,c.jsx)("strong",{children:"Every demon in the universe began here, as a human soul the Bone Mother would not or could not keep."})," She rejected Cain twice. She refused the stained soul of the Red Dragon. Her choices are the origin event for the entire population of Hell."]})]}),(0,c.jsxs)("div",{className:"dc em",children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Layer Eleven \xB7 The Opposing Plane"}),(0,c.jsx)("div",{className:"dc-t",children:"Formal Framework & Hell\u2019s Faction \xB7 Same Layer, Opposed"}),(0,c.jsxs)("div",{className:"dc-b",children:["At the bottom, two factions occupy the same plane and oppose each other \u2014 neither upstream of the other, both downstream of everything above.\\n\\n",(0,c.jsx)("strong",{class:"mn",children:"Heaven\u2019s Formal Framework"})," is the institutional claim: the enforcement arm that reframed the Grigori\u2019s relationship-commission as authority and surveillance. It is downstream of the Web it tried to govern.\\n\\n",(0,c.jsx)("strong",{class:"cr",children:"Hell\u2019s Faction"})," is the abandoned kingdom \u2014 cold, barren, the Princes\u2019 regency over souls the Bone Mother refused, the wrong compact maintained for twelve thousand years as Satan\u2019s prison lock. Nepisano built it and left it.\\n\\n",(0,c.jsx)("em",{children:"They are mirror institutions: each claims an authority it inherited rather than holds, each operates on a plane beneath the law it answers to. The series is the long correction of both."})]})]})]}),e==="bond"&&(0,c.jsxs)("div",{children:[(0,c.jsx)("div",{className:"sec",children:"The Theology of the Bond"}),(0,c.jsxs)("div",{className:"pull",children:["The Bond is not a contract. Not a compact of control. Not the formal framework\u2019s jurisdictional claim over a practitioner\u2019s corridor.",(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),(0,c.jsx)("em",{children:"The Bond is the choosing that runs both directions. The Watcher chooses. The practitioner chooses. Both choices held in the Older Mechanism\u2019s record simultaneously. The Web is built from all of them."})]}),[{t:"What Makes a Bond Correct",c:"",b:`The Older Mechanism\u2019s bond law is precise: the bond is constituted when both parties choose, and both choices are in the record simultaneously. Not sequentially. Not conditionally. Simultaneously.

The Watcher\u2019s choosing is not authority over the practitioner\u2019s corridor. It is accompaniment in the practitioner\u2019s work. Samyaza stood at the east wood for twenty-three mornings. Baraqiel spent eight months of Tuesday coffees before giving up on the argument with himself. Azazel stopped watching and started staying. Six times. The same choosing. The correct version.

<em>The bond is constituted when the record shows choosing in both directions simultaneously.</em>`},{t:"The Bond\u2019s Three Expressions",c:"g",b:`<strong class='g'>The Watcher-Anchor Bond:</strong> The Grigori\u2019s commission expressed in its correct form. Relationship not surveillance. The Lovers Arcana traces every correct bond in the Older Mechanism\u2019s record.<br/><br/><strong class='g'>The Familiar Bond:</strong> The practitioner and a geological entity, bonded across the scale difference. First expression: Arcadia and the Leviathan, 12,000 BCE. Most recent: Brian Lee Combs and Ravos (May, Year 3). The Web\u2019s living expression made possible.

<strong class='g'>The Moon-Bride Bond:</strong> The practitioner and the Moon\u2019s frequency \u2014 maintaining the channel between the daughters\u2019 practice and Hecate. Not a romantic bond. A frequency-holding bond. Two practitioners required: the one who holds the channel open, and the one who holds the practitioner holding it. Mariah Drennan and Cody Hatton. Restored Year 3-4 after three hundred years of institutional suppression.`},{t:"The Wrong Bond\u2019s Theology",c:"cr",b:`The wrong compact used fear as the bond\u2019s fuel. The Watcher\u2019s relationship with the practitioner was reframed as a jurisdictional claim: the Watcher as enforcer, the practitioner as the subject of enforcement, the corridor as the unit of control.

Asmodeus (Prince of Lust) had been working in the same older idiom as Mercy\u2019s practice for nine hundred years \u2014 alone, without the lateral Web. <em>The difference between Asmodeus and Mercy Tackett is not power. It is that Mercy found Armaros. She did not hold alone.</em>

relationship: the practitioner chose the frequency; the Arcana recognized it."]})]}),(0,c.jsx)("div",{className:"sec",children:"Active Arcana in the Series"}),[{n:"II \xB7 The High Priestess",c:"pu",b:"The Archive thread. The knowing that does not need to speak to be certain. June Tackett\u2019s gift runs through this Arcana. Twenty-one volumes of the prophetic record. Volume 21, page 42: <em>she is transmitting. She can be found.</em>"},{n:"III \xB7 The Empress",c:"gr",b:"The Earth Mother\u2019s Arcana expression. The daughters\u2019 thirty-thousand-year practice is The Empress\u2019s domain in the mortal layer. Her first direct statement in the human-recorded era came through The Empress\u2019s frequency in Year 4 (WW3): <em>My daughters are awake. They will not be silenced again.</em>"},{n:"VI \xB7 The Lovers",c:"cr",b:"The Bond\u2019s specific architecture. Traces every correct Watcher-Anchor bond in the Older Mechanism\u2019s record back to the Grigori\u2019s original commission. The Lovers Arcana noticed each of the six Pike County bonds as they were constituted. Invoked at full Arcana level in the Claiming (DA8)."},{n:"VIII \xB7 Strength",c:"g",b:"The warm room. The lion held by kindness not force. Noticed the Calhoun line for seven generations without the line knowing it. Noticed Carla June\u2019s accumulated frequency in the Hollow Diner. The Darkness finds the warm room resistant because Strength is his specific opposite."},{n:"XVI \xB7 The Tower",c:"cr",b:"Falls twice in OS5: the Order\u2019s collapse and the Church\u2019s dissolution as Satan\u2019s sealing substrate. Both were always going to fall. The Tower is the removal of what was built on the wrong foundation. Not catastrophe \u2014 correction."},{n:"XVII \xB7 The Star",c:"g",b:"Kokabiel\u2019s stellar domain. The star after the Tower falls. Pearlene Calhoun born under a specific star Kokabiel named before it was needed. The star aimed at the Unwritten in the Divine Arc \u2014 the coordinates for Hecate\u2019s position \u2014 is in his domain."},{n:"XVIII \xB7 The Moon (Hecate)",c:"mn",b:"<strong class='mn'>Hecate IS the Moon Arcana.</strong> Not the card\u2019s domain \u2014 the Primordial itself. Her structural function makes her the exception: not frequency-recognition but active maintenance. Holding the Darkness back. When she is displaced into the Unwritten in DA1, the Arcana does not dim. Its keeper is gone. This is different."},{n:"XIX \xB7 The Sun",c:"g",b:"DA10: The Resurrection. Clarity after the hidden things are found. Dixie\u2019s music carries the Sun\u2019s frequency in its production \u2014 Sandalphon (prayers and music archivist) has it in his record. The Sun at full strength for the first time since the arc began: the moment Hecate returns."},{n:"XXI \xB7 The World",c:"tl",b:"OS5 at full expression: 443 practitioners, every bond active, the Earth Mother speaking, Satan sealed, the succession holding. The completion of one cycle that makes the next cycle possible. Reached again in Year 7 (DA12) when Hecate returns to Gaia and the new Veil is built."}].map(a=>(0,c.jsxs)("div",{className:`dc ${a.c}`,style:{marginBottom:8},children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Active Arcana"}),(0,c.jsx)("div",{className:`dc-t ${a.c}`,children:a.n}),(0,c.jsx)("div",{className:"dc-b",dangerouslySetInnerHTML:{__html:a.b}})]},a.n)),(0,c.jsx)("hr",{}),(0,c.jsx)("div",{className:"sec",children:"The Darkness \xB7 The Origin Deception"}),(0,c.jsxs)("div",{className:"pull mn",children:["The Darkness is not a faction. He is not an army. His gender frequency is male. He cannot cross the boundary while the Veil holds. The lie is his only technique. He has no name in the mortal layer\u2019s language because it predates the mortal layer\u2019s language.",(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),(0,c.jsx)("em",{children:"He is the primal force the Veil was built to hold back. It has been using the same technique since before the daughters\u2019 practice existed. The technique has never failed until now."})]}),(0,c.jsxs)("div",{className:"dc mn",children:[(0,c.jsx)("div",{className:"dc-lbl",children:"The First Deception"}),(0,c.jsx)("div",{className:"dc-t mn",children:"The Darkness Separates Hecate from Gaia"}),(0,c.jsxs)("div",{className:"dc-b",children:["Before the daughters\u2019 practice had language for itself, the Darkness found Hecate in Gaia\u2019s presence. He listened first \u2014 he always listens first. He told her the first lie: ",(0,c.jsx)("em",{children:"that the warmth she was born into was a cage, that her true inheritance waited beyond the boundary\u2019s edge, that her mother\u2019s love was limitation wearing the shape of protection."}),"\\n\\nShe stepped toward the Veil to see for herself. The Darkness pulled her past it. She found her way back \u2014 but only to the boundary\u2019s edge, not to Gaia. She took her position as the Veil\u2019s keeper from the outside, holding back the thing that had tricked her across the boundary in the first place.\\n\\n",(0,c.jsx)("strong",{class:"mn",children:"She has been holding the Darkness back from that position ever since. She cannot return to Gaia. The Veil requires a keeper on this side of it."})]})]}),(0,c.jsxs)("div",{className:"dc cr",children:[(0,c.jsx)("div",{className:"dc-lbl",children:"The Repeated Technique"}),(0,c.jsx)("div",{className:"dc-t cr",children:"The Same Lie \xB7 Year 6 \xB7 DA1"}),(0,c.jsxs)("div",{className:"dc-b",children:["The mechanism has not changed in thirty thousand years. In DA1, the cascade from Satan\u2019s sealing gives him the moment of weakness he has been calculating toward since the origin. He uses the only technique he has ever had: ",(0,c.jsx)("em",{children:"the voice that sounds like Gaia, the promise of home just past the failing boundary."}),"\\n\\nHecate moves toward it. The Veil dissolves in her absence. The Moon goes silent. The Darkness does not break foundations. It deceives the people standing on them into walking away.\\n\\n",(0,c.jsx)("strong",{class:"cr",children:"This is why every correct bond built in the universe matters: each bond is a choosing that the Darkness cannot lie away. Accumulated love is the specific counter to accumulated deception."})]})]})]}),e==="factions"&&(0,c.jsxs)("div",{children:[(0,c.jsx)("div",{className:"sec",children:"Where Each Faction Stands in the Sacred Order"}),(0,c.jsxs)("div",{className:"pull",children:["Every faction in the H&H universe has a specific relationship to the cosmological order \u2014 a position, a function, and a specific way in which that function has been distorted or correctly expressed.",(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),(0,c.jsx)("em",{children:"None of the factions built the order. They all exist within it. The question is which ones know this."})]}),(0,c.jsx)("div",{className:"fac-grid",children:[{name:"The Daughters\u2019 Practice",topCol:"#4a8c4a",pos:"Primary \xB7 Layer Four of the Cosmological Stack \xB7 The foundational expression",b:`Thirty thousand years old. Older than the Grigori\u2019s commission. Older than the Older Mechanism\u2019s encoding. The daughters\u2019 practice predates every authority that has ever claimed governance over it. It is the specific form in which the Arcana layer\u2019s frequencies reach the human scale.

The Web Compact of Year 4 formally establishes what the Older Mechanism\u2019s record has always said: the daughters\u2019 practice is primary. Every other faction is downstream of it.`,err:null,cor:"The Web Compact. The 443. The Earth Mother\u2019s statement. Correct."},{name:"The Grigori",topCol:"#4a6fa5",pos:"Commissioned Layer \xB7 Between the Older Mechanism and the daughters\u2019 practice",b:`Commissioned through the Lovers Arcana to accompany the daughters\u2019 practice \u2014 not govern it, not enforce it, not contain it. Accompany it. The Grigori\u2019s original function is relationship.

The formal framework reframed their function as enforcement. This is the error the H&H series corrects: book by book, bond by bond, the Grigori return to what the Lovers Arcana commissioned them to be.`,err:"The formal framework\u2019s reframing of the commission as enforcement.",cor:"The correct bonds. Six books. The Grigori returning to relationship."},{name:"Heaven\u2019s Formal Framework",topCol:"#3b5bdb",pos:"Institutional Claim \xB7 Downstream of the Web \xB7 Below the Older Mechanism",b:`The formal framework was established after the Older Mechanism. Its jurisdiction claims derive from the Older Mechanism\u2019s authority \u2014 which the Older Mechanism\u2019s record does not fully support. The enforcement arm\u2019s mandate rests on a claim the foundational archive contradicts.

Metatron acknowledges in WMB6: <em>the formal framework is downstream of the Web. Always was.</em>`,err:"Claiming primary jurisdiction over a practice that predates the claim by thirty thousand years.",cor:"Metatron\u2019s WMB6 acknowledgment. The formal framework\u2019s advisory position in network corridors."},{name:"The Order of Shadows",topCol:"#991b1b",pos:"Maintenance Structure \xB7 Dressed as Hell\u2019s Weapon \xB7 Actually: Satan\u2019s Prison Mechanism",b:`Founded 1414 by Lucifer to maintain Satan\u2019s seal through the Church\u2019s institutional structure. Told the Princes it was Hell\u2019s greatest weapon against mortal practitioners. It was the seal\u2019s maintenance structure.

The Order\u2019s theological position: an institution built to serve a correct function (keeping a dangerous entity contained) through an incorrect method (fear, oath-binding, institutional compliance). The defections correct the method while the seal itself is correctly rebuilt.`,err:"The True Fallen binding\u2019s institutional compliance as the maintenance mechanism.",cor:"The four defectors. Lucifer\u2019s ultimate sacrifice. The correct seal."},{name:"Hell\u2019s Faction \xB7 The Seven Princes",topCol:"#dc2626",pos:"Regents of an Absent King \xB7 The Near-Unwritten \xB7 Caretakers of an Abandoned Kingdom",b:`Nepisano \u2014 the Unwritten, twin of Sano (The Sun), King of Hell \u2014 departed his kingdom before the daughters\u2019 practice had language for itself. He left it to the seven Princes: Lucifer (Pride), Satan (Wrath), Asmodeus (Lust), Mammon (Greed), Beelzebub (Gluttony), Leviathan (Envy), Belphegor (Sloth). They were regents for an absent king. They never fully understood what they were maintaining.

Hell is the near-Unwritten: cold, barren, very harsh. Souls the Bone Mother doesn\u2019t keep or receives unready have nowhere else to go. In the cold, without the Web\u2019s bond architecture to hold them, they lose their humanity slowly. They become demons. Every demonic entity in the H&H universe originates as a human soul that entered Hell and was changed by it.

Six Princes who maintained Satan\u2019s prison for twelve thousand years believing they were preserving Hell\u2019s greatest weapon. Their theological position: beings who serve a cosmological function (the wrong compact\u2019s maintenance) they do not understand.

Satan\u2019s theological position: a being whose wrath was so catastrophic (killing Arcadia, the first Omni Witch, immediately after the first correct compact) that the entire cosmological order built a prison for him. The Princes are the unknowing guards.`,err:"Preserving the wrong compact believing it was power rather than prison.",cor:"Satan sealed. Lucifer\u2019s sacrifice. The Penitent\u2019s Road."},{name:"The Penitents",topCol:"#0d9488",pos:"Between Hell\u2019s Faction and the Correct Order \xB7 Choosing Their Own Correct Function",b:`Dantalion, Gremory, Murmur \u2014 demons who chose the correct version of their own gift rather than the institutional version. The Penitent\u2019s Road is distinct from defection: defectors empty a faction\u2019s function; Penitents demonstrate that the function was never correctly understood.

<em>The Penitent\u2019s Road is more theologically threatening to Hell\u2019s faction than the defections: defectors leave. Penitents stay in their domain and do it correctly.</em>`,err:null,cor:"Each Penitent chooses the correct expression of their gift: Gremory restoring, Murmur translating the dead correctly, Dantalion acknowledging his own face."}].map(a=>(0,c.jsxs)("div",{className:"fac",style:{borderTopColor:a.topCol},children:[(0,c.jsx)("div",{className:"fac-name",children:a.name}),(0,c.jsx)("div",{className:"fac-pos",style:{color:a.topCol},children:a.pos}),(0,c.jsx)("div",{className:"fac-b",dangerouslySetInnerHTML:{__html:a.b}}),a.err&&(0,c.jsxs)("div",{className:"fac-err",children:["Error: ",a.err]}),a.cor&&(0,c.jsxs)("div",{className:"fac-cor",children:["Correction: ",a.cor]})]},a.name))}),(0,c.jsx)("hr",{}),(0,c.jsx)("div",{className:"sec",children:"The Theological Stakes of Each Arc"}),[{arc:"H&H Books 1\u20136 (Year 0)",c:"g",q:"Can the correct compact be established against both Hell\u2019s faction and Heaven\u2019s enforcement arm simultaneously?",a:"Yes. The Older Mechanism\u2019s authority is prior to both factions\u2019 claims. The correct compact holds not because it out-powers the opposition but because it is constituted correctly."},{arc:"Leviathan Arc (Year 2-3)",c:"tl",q:"Does the compact\u2019s authority extend to geological scale?",a:"Yes. The New Compact\u2019s ratification at thirty-one threads is sufficient for the Older Mechanism to recognize the geological layer as under the Web\u2019s jurisdiction. The Horde is in the compact\u2019s range."},{arc:"Web of the Weavers (Year 3-4)",c:"gr",q:"Is the daughters\u2019 practice primary or subordinate?",a:"Primary. Thirty thousand years prior to every institutional claim. The Web Compact makes this explicit at the legal level. The Earth Mother\u2019s statement makes it cosmologically permanent."},{arc:"Order of the Shadows (Year 5)",c:"cr",q:"Can the seal be rebuilt correctly after the wrong compact\u2019s maintenance structure collapses?",a:"Yes. The correct architecture (four defectors\u2019 knowledge + Brian Lee\u2019s geological translation + the 443\u2019s frequency) produces a seal that does not require fear as its substrate."},{arc:"Divine Arc (Year 6-7)",c:"",q:"Can the Darkness\u2019s first lie be answered?",a:"Yes. Not with a counter-argument. With the correct action: the accumulated weight of every bond built in Gaia\u2019s daughters\u2019 world \u2014 the specific force the Darkness never found a way to lie away. Fire Solstice, Year 7."}].map(a=>(0,c.jsxs)("div",{className:`dc${a.c?" "+a.c:""}`,style:{marginBottom:9},children:[(0,c.jsx)("div",{className:"dc-lbl",children:a.arc}),(0,c.jsx)("div",{className:"dc-t pu",style:{fontStyle:"italic",fontSize:13},children:a.q}),(0,c.jsx)("div",{className:"dc-b",children:a.a})]},a.arc))]}),e==="web"&&(0,c.jsxs)("div",{children:[(0,c.jsx)("div",{className:"sec",children:"The Web \xB7 What It Is"}),(0,c.jsxs)("div",{className:"pull gr",children:["The Web is not the network. The network is what the Web produces when practitioners are in lateral contact.",(0,c.jsx)("br",{}),"The Web itself is the thirty-thousand-year record of the daughters\u2019 practice \u2014 the bone record\u2019s lateral connections, the Moon-Bride channel, the Dreamer\u2019s Archive thread, the thread placements in each corridor.",(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),(0,c.jsx)("em",{children:"You don\u2019t build the Web. You find that it was always there."})]}),[{t:"The Web\u2019s Components",c:"gr",b:`<strong class='gr'>The Bone Record:</strong> Hettie Maelin\u2019s thirty-thousand-year lateral channel. Holds every practitioner who ever practiced in the daughters\u2019 tradition across all geographies. The Bone Mother holds what the mortal layer cannot yet carry.

<strong class='gr'>The Moon-Bride Channel:</strong> The thread Hecate uses to maintain contact with Gaia\u2019s daughters from the boundary\u2019s edge. Suppressed for three hundred years. Restored WW2. The specific mechanism that detects Hecate\u2019s displacement in DA1.

Della\u2019s thirty years of soil reading, June\u2019s twenty-one volumes of dream record, D\u2019s atmospheric monitoring, Mariah\u2019s Moon-Bride channel \u2014 the same contact made at different frequencies in different registers. <em>The gift is prior. The Web was always there.</em>`}].map(a=>(0,c.jsxs)("div",{className:`dc${a.c?" "+a.c:""}`,style:{marginBottom:11},children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Web Doctrine"}),(0,c.jsx)("div",{className:`dc-t${a.c?" "+a.c:" pu"}`,children:a.t}),(0,c.jsx)("div",{className:"dc-b",style:{whiteSpace:"pre-line"},dangerouslySetInnerHTML:{__html:a.b}})]},a.t)),(0,c.jsx)("hr",{}),(0,c.jsx)("div",{className:"sec",children:"The Horde \xB7 Geological Theology"}),(0,c.jsxs)("div",{className:"pull tl",children:["The Horde is the Earth\u2019s geological memory made conscious. Not territorial \u2014 geological. They do not recognize national borders. They recognize fault lines.",(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),(0,c.jsx)("em",{children:"The compact\u2019s jurisdiction covers geological entities. Dixie demonstrated this in WMB1 with one word in the anchor bond. The wyrm stopped."})]}),[["The Primary Leviathan","Apex entity. Singular. First bonded with Arcadia in 12,000 BCE. Cardiac frequency legible since WMB2. The entire Leviathan Arc\u2019s theology rests on the question of what it means to choose relationship across the geological-to-human scale difference. Brian Lee Combs is the answer."],["Methane Wyrms","Blue-white fire. Three hundred million years old. The oldest creatures in the Horde by geological age. Born from organic matter compressed over geological time in coal and gas seams worldwide. The extraction economy\u2019s destruction of their habitat is Haagenti\u2019s specific operation."],["Rock Dragons","Territorial. Mountain-dwelling. Twelve-thousand-year sleep cycles. They wake disoriented by a mortal layer that has changed while they slept. Not hostile \u2014 confused. Brian Lee\u2019s mediation capacity (the notebook, the translation project) is the theological response to what it means when an ancient entity wakes in a changed world."],["Fault Wyrms \xB7 Volcanic Wyrms \xB7 Deep Water Leviathans","The tectonic, the magmatic, and the oceanic. Each communicates in its own geological register. The Ley Line carriers translate between registers. Samyaza (Horde General) receives all registers simultaneously. Brian Lee is the only human who can also receive at human-accessible scale."],["The Governance Gap","Thirty percent of the known Horde is under Warden governance. Sixty percent is reachable through the Ley Line carrier network. Forty percent \u2014 including the Antarctic glacial drakes (thirty million years dormant, now stirring) and the Mariana Deep Leviathan \u2014 is completely unknown. Brian Lee\u2019s dual Familiar bond is the theological mechanism through which the governance gap can eventually close."]].map(([a,l])=>(0,c.jsxs)("div",{className:"gift-row",children:[(0,c.jsx)("div",{className:"gr-name",children:a}),(0,c.jsx)("div",{className:"gr-body",children:l})]},a)),(0,c.jsx)("hr",{}),(0,c.jsx)("div",{className:"sec",children:"The Nephilim \xB7 The Bridge Category"}),(0,c.jsxs)("div",{className:"dc g",children:[(0,c.jsx)("div",{className:"dc-lbl",children:"The Nephilim Doctrine"}),(0,c.jsx)("div",{className:"dc-t g",children:"Neither Practitioner Nor Watcher \xB7 The Web\u2019s Living Expression"}),(0,c.jsxs)("div",{className:"dc-b",children:["The Nephilim are human beings who carry the Grigori\u2019s domain frequency in their bodies, who can translate between the geological scale and the human scale, who are neither Watcher nor practitioner but the specific category the Older Mechanism has no previous record for.\\n\\nBrian Lee Combs \u2014 first Nephilim born to a chief Watcher in twelve thousand years \u2014 is the proof of concept. His notebook entries from age five onward are the beginning of the Horde\u2019s longest mortal-layer translation project. His statement in WMB5: ",(0,c.jsx)("em",{children:"I think I\u2019m here to be what the Web was designed to make possible. The relationship. The real version."}),"\\n\\nThe Nephilim\u2019s specific theological gift: ",(0,c.jsx)("strong",{class:"g",children:"the relationship. The real version."})," Not mediation as service. Mediation as nature. Being built at the intersection of the geological and the human such that the intersection is a person, not a technique."]})]}),(0,c.jsxs)("div",{className:"dc g",children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Nephilim \xB7 The Working Faction Bible"}),(0,c.jsx)("div",{className:"dc-t g",children:"Neither Layer, Both Scales \xB7 The Children of the Compact"}),(0,c.jsxs)("div",{className:"dc-b",children:["A Nephilim is a person whose native frequency sits between human and Watcher: they hear every scale and are heard by every scale, at once. Any union with a Grigori can produce one; a correct bond (choosing in both directions) produces a thriving Nephilim, while others are suppressed or damaged. They never wholly belong to either world, age and heal differently so most outlive everyone they love, and are hunted by everything that wants to use or destroy them. The Horde recognizes them as kin.",(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),(0,c.jsx)("strong",{children:"The Flood Clause:"})," the founding Commission, with Heaven and Hell agreeing, ordered all Nephilim destroyed (Goliath as precedent). It was never repealed, so every Nephilim is technically condemned. Earlier Nephilim existed in the Garden era, children of the first Familiar Bonds; the twelve-thousand-year gap is since the last born to a chief Watcher.",(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),(0,c.jsx)("strong",{children:"The faction:"})," about two dozen exist when the series opens. Brian Lee Combs, Wren Tackett (later Pearlene Calhoun) and Styxx are confirmed; Caleb, Metatron's son, is the bridge to Heaven's Scribe. Their story is its own later series, ",(0,c.jsx)("em",{children:"The Children of the Compact"}),". A Nephilim is proof of the bond: two beings trusted each other across a gap."]})]})]}),e==="time"&&(0,c.jsxs)("div",{children:[(0,c.jsx)("div",{className:"sec",children:"The Frequency Principle \xB7 The Foundational Law of All Magical Work"}),(0,c.jsxs)("div",{className:"pull g",children:["The frequency of the body changes during high emotional vibrations.",(0,c.jsx)("br",{}),(0,c.jsx)("em",{children:"The stronger the emotion \u2014 the stronger the frequency \u2014 the stronger the work."}),(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),"This is not a principle of dark arcana alone. It is the foundational operating law of every magical system in the H&H universe. The daughters\u2019 practice harnesses it through love, trust, and the correct bond. Dark arcana harnesses it through fear, grief, and forced emotional extremity. Same law. Opposite application."]}),[{t:"The Death Frequency",c:"sl",b:"Every body releases a specific frequency at the moment of death. This is how Hecate knows \u2014 she reads it and opens the passage to the Bone Mother\u2019s realm, which exists just behind the Veil before the soul reaches Hell. Vine (Duke, formerly a mortal witch-hunter) discovered through dark arcana that this frequency can be harnessed. His secret: <strong>the death frequency is exponentially stronger when death occurs during high emotional states, particularly fear.</strong> A body that dies in fear releases a signal many times more powerful than a body that dies at peace. Vine brought this to Lucifer as the power source for the seal."},{t:"Emotion as Amplifier",c:"g",b:"The principle applies to all magical work. A practitioner working through love channels a different frequency than one working through fear \u2014 neither breaks the law, both use it. The bond\u2019s frequency is the most resilient because love freely given and freely received produces the longest-held emotional vibration in the human body. Twenty-six years of Carla June\u2019s warm room is an extraordinary frequency source. That is why dark arcana cannot corrupt it: you cannot disrupt a frequency that is being continuously replenished by the same emotion that constitutes it."},{t:"The Moon Phases \xB7 Demonic Operational Windows",c:"cr",b:`Demons work best in shadows. Hecate\u2019s vigil is the mortal layer\u2019s primary protection.

<strong>The Full Moon:</strong> worst night for demonic activity. Hecate\u2019s attention is at maximum. Her frequency is at its peak.

<strong>The New Moon:</strong> peak demonic activity. Hecate\u2019s attention is at its most inward. Every significant demonic operation in the universe\u2019s history has been timed to the new moon when possible.

Vine\u2019s Church persecution served two purposes simultaneously: the deaths in fear produced massive frequency harvests, and Hecate\u2019s grief at watching her mother\u2019s daughters persecuted caused her to turn from her vigil \u2014 lowering the Veil\u2019s average frequency across all moon phases over centuries. The world has only gotten darker since.`}].map(a=>(0,c.jsxs)("div",{className:`dc ${a.c}`,style:{marginBottom:11},children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Frequency Doctrine"}),(0,c.jsx)("div",{className:`dc-t ${a.c}`,children:a.t}),(0,c.jsx)("div",{className:"dc-b",style:{whiteSpace:"pre-line"},dangerouslySetInnerHTML:{__html:a.b}})]},a.t)),(0,c.jsx)("hr",{}),(0,c.jsx)("div",{className:"sec",children:"Abaddon \xB7 The Abyss \xB7 Sano\u2019s Brother\u2019s Keeper"}),(0,c.jsxs)("div",{className:"pull mn",children:["Not a Prince. Not a Duke. Not a Feral. Not a Minor Demon. The oldest soul in Hell.",(0,c.jsx)("br",{}),"He answers to no one. He made one deal in his existence: with Sano, on the grave of his wife Arcadia.",(0,c.jsx)("br",{}),(0,c.jsx)("em",{children:"That deal is the origin of the Web compact that governs the daughters\u2019 practice."})]}),[{t:"What Abaddon Is",c:"mn",b:`In life Abaddon was a dragon slayer. His human dragon-slayer magic was formidable \u2014 enough to face the Red Dragon \u2014 but it was mortal magic, and mortal magic alone could never have carried him into the deepest Unwritten, carved the Abyss from forces that predate souls entirely, and outlasted every one of them. The power that does that is not his own. It is lent. The deal with Sano gives Abaddon what his dragon-slayer magic could not manage on its own, and that lent power is why he is the oldest soul in Hell still himself.

The second half of the why: Hell has never corrupted him. Every other soul arrived because the Bone Mother refused or received it unready, and the cold takes their humanity by degrees until a demon is what remains. Abaddon is the exception because he is in Hell willingly \u2014 he chose to come, bound by the deal, and the cold has no claim on a soul it was never delivered. He keeps himself entirely. He answers to no one: not Nepisano, not the Princes, not any Duke or Feral. His one relationship of note is with Sano, made as an equal, on a grave, in grief.`},{t:"The Deal at Arcadia\u2019s Grave",c:"g",b:`Arcadia \u2014 the first Omni Witch, who bonded with the Leviathan and chose it over Satan \u2014 was Abaddon\u2019s wife. Satan\u2019s rage at the rejection cost Arcadia her life. Abaddon killed Satan\u2019s dragon form at Arcadia\u2019s grave. The battle\u2019s frequency \u2014 grief, rage, love, loss at maximum expression \u2014 reached Sano. Sano came to the grave. The deal:

<strong>Abaddon keeps Nepisano away from Hecate. Sano protects Abaddon\u2019s twin daughters by Arcadia.</strong>

The daughters: Celeste (named for the Star Arcana) and Lyrica (named for the unsung music of creation). They became Gaia\u2019s adopted daughters. The first Weavers. This agreement IS the compact that governs the Web.`},{t:"The Loophole \xB7 DA1",c:"void",b:"Abaddon can stop Nepisano from crossing to Hecate. He cannot stop Hecate from turning toward Nepisano willingly. The DA1 displacement\u2019s specific mechanism \u2014 Hecate turning her full gaze to the world, the overcharged moon, the Tower\u2019s shock creating the gap \u2014 is technically outside the deal\u2019s terms. Nepisano did not cross to Hecate. She turned. He grabbed her hand in the window. The deal held. The loophole did not."}].map(a=>(0,c.jsxs)("div",{className:`dc ${a.c}`,style:{marginBottom:11},children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Abaddon Doctrine"}),(0,c.jsx)("div",{className:`dc-t ${a.c}`,children:a.t}),(0,c.jsx)("div",{className:"dc-b",style:{whiteSpace:"pre-line"},dangerouslySetInnerHTML:{__html:a.b}})]},a.t)),(0,c.jsx)("hr",{}),(0,c.jsx)("div",{className:"sec",children:"The Theology of the Fire Solstice \xB7 The Seven-Year Cycle"}),(0,c.jsxs)("div",{className:"pull g",children:["The Older Mechanism\u2019s record notes the date of the compact\u2019s opening: the fire solstice, Year 0 \u2014 the longest day, the sun at its peak.",(0,c.jsx)("br",{}),"Seven years later, on the same solar position, the Restoration closes the cycle.",(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),(0,c.jsx)("em",{children:"The compact opens on the fire solstice. The Restoration closes on the fire solstice. Seven years. The same day. The sun at its peak on both ends of the arc."})]}),(0,c.jsx)("div",{className:"cycle",children:[{col:"#c9943a",bg:"#100806",lbl:"FIRE SOLSTICE \xB7 YEAR 0",note:"The compact ratified at the Calhoun homestead. The Older Mechanism\u2019s record opened. The seven-year cycle begins."},{col:"#0d9488",bg:"#020e0d",lbl:"JULY \xB7 YEAR 0",note:"Pearlene Calhoun born under the specific star Kokabiel named before it was needed."},{col:"#0d9488",bg:"#020e0d",lbl:"JULY \xB7 YEAR 3",note:"New Compact ratified at Della\u2019s property. Satan\u2019s seal substrate begins failing."},{col:"#4a8c4a",bg:"#030a03",lbl:"YEAR 4",note:"Web Compact ratified. Earth Mother speaks. The daughters awake."},{col:"#991b1b",bg:"#0a0202",lbl:"APRIL \xB7 3 AM \xB7 YEAR 5",note:"Satan sealed. Lucifer\u2019s sacrifice. Pearlene receives the anchor seal."},{col:"#a78bfa",bg:"#1a1230",lbl:"YEAR 6 \xB7 DA1",note:"The Darkness repeats the original lie. Hecate displaced. The Veil dissolves."},{col:"#a78bfa",bg:"#1a1230",lbl:"FIRE SOLSTICE \xB7 YEAR 7",note:"The Restoration. Gaia and Hecate. The new Veil. The Darkness\u2019s first lie finally answered. The cycle closes."}].map((a,l,n)=>(0,c.jsxs)("div",{style:{width:"100%",maxWidth:520,display:"flex",flexDirection:"column",alignItems:"center"},children:[(0,c.jsxs)("div",{className:"cy-node",style:{background:a.bg,borderColor:a.col},children:[(0,c.jsx)("div",{className:"cy-lbl",style:{color:a.col},children:a.lbl}),(0,c.jsx)("div",{className:"cy-note",style:{color:a.col},children:a.note})]}),l<n.length-1&&(0,c.jsx)("div",{className:"cy-arr",style:{background:a.col}})]},a.lbl))}),(0,c.jsxs)("div",{className:"dc g",children:[(0,c.jsx)("div",{className:"dc-lbl",children:"Why the Fire Solstice"}),(0,c.jsx)("div",{className:"dc-t g",children:"The Longest Day \xB7 The Sun at Its Peak"}),(0,c.jsxs)("div",{className:"dc-b",children:["The fire solstice is the longest day of the year \u2014 the solar year\u2019s maximum light. In the H&H universe\u2019s theological calendar, it is the day when the Sun Arcana (XIX) operates at its fullest expression. The compact ratified on the fire solstice is ratified at the Sun\u2019s peak, which means it is ratified at the Arcana layer\u2019s most available moment of contact with the mortal layer.\\n\\nThe Restoration closing on the same day is not coincidence and not symmetry for its own sake. The new Veil must be built when the Arcana layer\u2019s expression in the mortal layer is at its annual maximum \u2014 because the Veil is the boundary between the Arcana layer and the Unwritten, and building it requires the Arcana layer\u2019s full available presence.\\n\\n",(0,c.jsx)("em",{children:"Seven years. The same fire solstice. The compact\u2019s opening and its closing on the same day, seven years apart, is the Older Mechanism\u2019s most complete temporal record of a correctly constituted arc."})]})]}),(0,c.jsx)("hr",{}),(0,c.jsx)("div",{className:"sec",children:"Death, Transition & The Thinning"}),(0,c.jsxs)("div",{className:"pull",children:["Death in the H&H universe is not the ending card. It is the transition card. The Death Arcana\u2019s domain is the Thinning \u2014 the specific boundary between the mortal layer and what lies beyond it.",(0,c.jsx)("br",{}),(0,c.jsx)("br",{}),(0,c.jsx)("em",{children:"The Bone Mother holds what the mortal layer cannot yet carry. That is Death\u2019s function in this universe."})]}),[{t:"The Thinning",c:"sl",b:`The Thinning is not a veil in the sense that it hides things. It is the geological and spiritual pressure point where the mortal layer and the transition layer become permeable to each other. The compact\u2019s jurisdiction over the Pike County Thinning is what makes the corridor\u2019s network hub function possible. The creek is the Thinning\u2019s primary geographic anchor.

Mama Calhoun held the Thinning for fifty-three years. The holding was not preventing death from functioning. It was preventing the Thinning from being exploited by forces \u2014 Vepar\u2019s water corruption, the wrong compact\u2019s fear-substrate \u2014 that wanted to use it as an attack vector rather than a transition.`},{t:"The Bone Mother\u2019s Holding",c:"sl",b:`The Bone Mother holds what the mortal layer cannot yet carry. Tom Maelin is held at the Thinning\u2019s edge \u2014 present in the bone record, accessible through the bone-keeper\u2019s channel, but not in the mortal layer in the ordinary sense.

Held. Not lost. The theological distinction: the mortal layer\u2019s transition function (Death) does not eliminate what passes through it. It holds it at the appropriate threshold until the mortal layer can receive it or until the correct event releases it. <em>Anselm dies on Edna Mae\u2019s porch and the Mother receives him.</em> The Mother. Not the end.`},{t:"Geological Time as Theological Category",c:"tl",b:`The Horde\u2019s time scale is geological: methane wyrms three hundred million years old, glacial drakes dormant for thirty million years, the Leviathan conscious since before the first compact. The mortal layer\u2019s human time and the Horde\u2019s geological time are both real and operating simultaneously.
